openapi: 3.1.0
info:
  title: AO Cloud Public API
  version: 1.0.0
  description: |
    Client-facing contract for AO Cloud. The control-plane foundation in this
    repository currently serves the Google authentication and current-account
    routes. Project, session, worker, SCM, terminal, and workspace routes remain
    staged contracts for later implementation.
    `backend/internal/cloud/httpapi` holds a parity test that fails if a route
    is mounted without an entry here, or contracted without being listed as
    still owed.

    ## Conventions

    **Authentication.** Every route takes `Authorization: Bearer <accessToken>`
    from the AO session issued by `exchangeGoogleIdentity` or
    `refreshAOSession`. The exceptions are deliberate and marked `security: []`:
    the three auth routes themselves, the GitHub callback, `connectTerminal`
    (a WebSocket handshake cannot carry headers, so it uses a single-use
    ticket), and the worker routes, which use their own `Worker` credential.

    **Tenant scoping.** The organization is in the path, not a header or a token
    claim, so every request states the tenant it means and a misrouted request
    fails loudly instead of resolving against whichever org the token happened
    to carry. A caller without a membership in `{orgId}` gets the same answer as
    one asking for an org that does not exist, so the surface cannot be used to
    probe for tenants. Account-wide routes (`/me`, `/github/user`) have no
    `{orgId}` because they describe the user rather than a tenant.

    **Errors.** Every non-2xx response is an `ErrorEnvelope`, including the
    WebSocket upgrade failures. `code` is the stable machine-readable value —
    branch on it, never on `message`, which is prose and may change. `requestId`
    is what to quote in a support request.

    **Pagination.** List routes take `cursor` and `limit` and answer with
    `{items, page}`, where `page.nextCursor` is present only while
    `page.hasMore` is true. Cursors are opaque and single-use for a given
    ordering — never construct or persist one.

    **Idempotency.** Every route that creates or destroys durable state requires
    `Idempotency-Key`. Replaying a key with the same command returns the original
    result, so a client that lost the response can retry without creating a
    second project or reviving a deleted session; replaying it with a different
    command is `IDEMPOTENCY_CONFLICT`. Reads and updates do not take the header —
    `updateProject` is a full-value PATCH and is naturally idempotent.

    **Local parity.** Fields that exist only to keep the desktop's existing
    `/api/v1` components working against Cloud are optional, and their local
    default is stated on the field. Cloud-only fields — org, workspace, and
    provider state — are optional too and are simply absent for local AO. Note
    that defaults are documented in prose rather than as a schema `default:`:
    `openapi-typescript` promotes a defaulted response property to a *required*
    one, which would defeat the point.
security:
  - bearerAuth: []
tags:
  - name: Account
  - name: Agents
  - name: Projects
  - name: Sessions
  - name: GitHub
  - name: Pull Requests
  - name: Reviews
  - name: Events
  - name: Terminal
  - name: Workspace
  - name: Providers
  - name: Worker Lifecycle
  - name: Worker Execution
  - name: Worker Orchestration
  - name: Worker Transport
paths:
  /api/cloud/v1/auth/google:
    post:
      operationId: exchangeGoogleIdentity
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleIdentityExchange"
      responses:
        "200":
          description: Google identity verified and an AO session issued.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AOSession"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/auth/refresh:
    post:
      operationId: refreshAOSession
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: The refresh token was consumed and replaced atomically without extending the session's absolute expiry.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AOSession"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/auth/logout:
    post:
      operationId: logoutAOSession
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204":
          description: The refresh token was revoked. AO access tokens expire naturally.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/me:
    get:
      operationId: getCurrentAccount
      tags: [Account]
      responses:
        "200":
          description: The authenticated user and their active organization memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user:
    get:
      operationId: getGitHubUserConnection
      tags: [GitHub]
      responses:
        "200":
          description: The authenticated user's account-wide GitHub connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserConnection"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: disconnectGitHubUser
      tags: [GitHub]
      responses:
        "204":
          description: The account-wide GitHub authorization was revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user/authorize:
    post:
      operationId: startGitHubUserAuthorization
      tags: [GitHub]
      responses:
        "201":
          description: A short-lived account-wide GitHub authorization attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserAuthorizationStart"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user/callback:
    get:
      operationId: completeGitHubUserAuthorization
      tags: [GitHub]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GitHub authorization completion page.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/agents:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listAgents
      tags: [Agents]
      responses:
        "200":
          description: Agent profiles supplied by the runtime and organization host.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentProfile"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listProjects
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of projects in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [Projects]
      description: |
        Read one project the caller's organization owns. Discovery pairs this
        with `listProjects`: the page carries the same `Project` shape, so a
        client that already has a listed project never needs this call to
        render, only to refresh a single row.
      responses:
        "200":
          description: Project details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Project settings updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Archive the project and tear down its cloud workspace. The call is
        idempotent under `Idempotency-Key`: a retry of the same key returns the
        original result rather than reporting a missing project, so a client
        that loses the response can safely repeat it.
      responses:
        "202":
          description: Project archived and sandbox teardown accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/{projectId}/resume:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: resumeProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Bring a `suspended` project's cloud workspace back online so its
        sessions can run again. Resume is asynchronous: the response carries the
        project with `lifecycleState` set to `provisioning` (or already `ready`
        when nothing needed starting), and the client observes completion by
        re-reading the project or by the session events of the sessions it cares
        about.

        Resuming a `ready` project is a no-op that returns the project
        unchanged. Resuming an `archived` project fails with
        `PROJECT_ARCHIVED` — archived projects are re-created, not resumed.

        Local AO has no suspended state, so its projects are always `ready` and
        the local adapter never issues this call.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeProjectInput"
      responses:
        "202":
          description: Workspace resume accepted, or the project was already running.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubInstallations
      tags: [GitHub]
      responses:
        "200":
          description: GitHub App installations connected to the organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/start:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: startGitHubInstallation
      tags: [GitHub]
      responses:
        "201":
          description: A short-lived GitHub App installation attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationStart"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/sync:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: syncGitHubInstallation
      tags: [GitHub]
      responses:
        "202":
          description: Repository synchronization accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: disconnectGitHubInstallation
      tags: [GitHub]
      responses:
        "200":
          description: The GitHub App installation was disconnected from AO.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/repositories:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubRepositories
      tags: [GitHub]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of repositories currently or historically granted to the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/projects:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createProjectFromGitHub
      tags: [GitHub, Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubProjectInput"
      responses:
        "201":
          description: Project created from an actively granted GitHub repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/scratch:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createGitHubScratchProject
      tags: [GitHub, Projects, Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubScratchProjectInput"
      responses:
        "201":
          description: GitHub repository, AO project, and first orchestrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGitHubScratchProjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listSessions
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of sessions in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSession
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [Sessions]
      responses:
        "200":
          description: Session details.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Delete the session's sandbox permanently. Durable history — messages,
        events, pull-request observations — is retained, so the session stays
        readable but can never be restored. Use `terminateSession` for the
        reversible stop.

        Idempotent under `Idempotency-Key`: retrying the same key returns the
        original result instead of failing on the now-missing sandbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/terminate:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: terminateSession
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Stop the agent and release the session's compute, keeping the session
        and its history restorable. This is the Cloud counterpart of the local
        `POST /api/v1/sessions/{sessionId}/kill`, and the same reversible
        contract: `isTerminated` becomes true, `activityState` becomes `exited`,
        `status` becomes `terminated`, and `restoreSession` can bring it back.

        Termination is asynchronous — the response reports the session with the
        terminal intent already recorded, while the sandbox may still be
        stopping. Terminating an already-terminated session is a no-op that
        returns the session unchanged.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminateSessionInput"
      responses:
        "202":
          description: Termination recorded; sandbox teardown may still be in flight.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/restore:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: restoreSession
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Bring a terminated session back: re-provision a sandbox, restore the
        workspace at the branch the session owns, and resume the agent with its
        transcript. Counterpart of the local
        `POST /api/v1/sessions/{sessionId}/restore`.

        Asynchronous, like terminate: the response carries the session with
        `isTerminated` already false and `sandbox.state` reporting how far the
        re-provision has got. A restore whose project is `suspended` fails with
        `PROJECT_SUSPENDED` — resume the project first. A session whose sandbox
        was deleted with `deleteSession` fails with `SESSION_SANDBOX_DELETED`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreSessionInput"
      responses:
        "202":
          description: Restore accepted; the sandbox may still be provisioning.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/activity:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionActivity
      tags: [Sessions]
      description: |
        The session's current activity, runtime, and sandbox state without the
        rest of the session record. Intended for the poll a client runs while a
        spawn, terminate, restore, or project resume settles — the payload is
        small enough to poll at a few seconds without the cost of a full
        `getSession`.

        Steady-state clients should prefer `streamClientEvents`; this route
        exists because sandbox transitions are not turn events and so do not
        appear on that stream.

        Unlike local AO's `POST /api/v1/sessions/{sessionId}/activity`, which is
        how an agent hook *reports* a state, this is read-only. Cloud agents
        report activity over the worker route (`publishEvent`), never here.
      responses:
        "200":
          description: The session's activity snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionActivity"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/pull-requests:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionPullRequests
      tags: [Pull Requests]
      responses:
        "200":
          description: Normalized provider pull-request observations for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPullRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/reviews:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionReviewState
      tags: [Reviews]
      responses:
        "200":
          description: AO review planning state and recorded runs for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReviewState"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: sendMessage
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 65536
      responses:
        "202":
          description: Message accepted and durably appended.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/UserMessageEvent"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/turns/{turnId}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: cancelTurn
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation was durably requested for the turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/chat-events:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: replayClientEvents
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Client-visible events after the supplied sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEventPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamClientEvents
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: |
            Replay followed by live client-visible events. Each SSE data field
            contains a ClientEvent; the SSE id is its sequence.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/terminal-ticket:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createTerminalTicket
      tags: [Terminal]
      description: |
        Mint the credential for one terminal attachment and return, alongside
        it, everything needed to make the connection.

        The handoff is deliberately two-credential: the bearer token proves who
        the caller is to the control plane and never leaves it, and the ticket
        is what travels to the terminal listener. The ticket is single-use,
        short-lived, and bound to this session, this `kind`, and the scopes
        granted below, so a leaked query string cannot be replayed and cannot
        reach another session.

        `scopes` in the request is a *request*, not an assertion. The server
        grants the intersection of what was asked for and what the caller's
        organization role allows, and the response reports what was actually
        granted. Asking for nothing asks for the caller's full authority. Asking
        for a scope the caller does not hold is not an error — the scope is
        simply absent from the response, so a read-only viewer degrades to a
        read-only terminal instead of failing to open one.

        The response embeds the same `TerminalConnection` that
        `getTerminalConnection` returns, so a client that already intends to
        attach needs exactly one round trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/TerminalKind"
                scopes:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/TerminalScope"
                  description: |
                    Scopes the client intends to use. Absent requests the
                    caller's full authority for this session.
      responses:
        "201":
          description: Short-lived, single-use terminal access ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalTicket"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/terminal-connection:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getTerminalConnection
      tags: [Terminal]
      description: |
        Where and how to attach to this session's terminal, without minting a
        ticket. A client calls this to decide whether to offer a terminal at all
        — `kinds` reports which terminals the session actually has, and an empty
        `kinds` means a session whose sandbox is not running has nothing to
        attach to.

        The attach host is returned rather than assumed. Cloud is free to serve
        terminals from a listener that is not the control plane's own origin, so
        a client must use `url` from here (or from the ticket) and must not
        rebuild it from the API base URL.
      parameters:
        - name: kind
          in: query
          description: |
            Restrict the answer to one terminal kind. Absent describes every
            kind the session has.
          schema:
            $ref: "#/components/schemas/TerminalKind"
      responses:
        "200":
          description: Terminal attachment metadata for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalConnection"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/terminal:
    get:
      operationId: connectTerminal
      tags: [Terminal]
      summary: Upgrade to a terminal WebSocket using a short-lived ticket.
      security: []
      description: |
        Attach to a session terminal. This is the only route that authenticates
        with a ticket instead of a bearer token: browsers cannot set headers on
        a WebSocket handshake, so the credential travels in the query string.
        That is why the ticket is single-use, short-lived, and scope-bound —
        see `createTerminalTicket`.

        The path shown here is the default the control plane serves. Clients
        must attach to the `url` reported by `getTerminalConnection` or by the
        ticket, which may point at a different listener.

        Handshake. The client requests the WebSocket subprotocol named by
        `TerminalConnection.protocol` (`ao.terminal.v1`). A server that does not
        select it is speaking something else and the client must close rather
        than guess a framing.

        Framing. Every frame is a JSON text message with a `type` discriminator
        — `TerminalClientFrame` inbound, `TerminalServerFrame` outbound. Byte
        payloads are base64 in `data`, because PTY output is arbitrary bytes and
        need not be valid UTF-8. This mirrors the base64 `data` and
        `columns`/`rows` shapes the worker transport routes already use, so the
        compute plane forwards frames without re-encoding them.

        Ordering and replay. Every `output` frame carries a monotonically
        increasing `sequence`. Passing `after` replays buffered output with a
        sequence strictly greater than it and then continues live, which is what
        makes a dropped connection recoverable: reconnect with the last
        `sequence` the client rendered. `after=0` replays the whole retained
        buffer. The server's first frame is always `ready`, carrying the current
        head sequence and the authoritative grid, so a client can detect that
        the buffer no longer reaches its cursor and clear its screen instead of
        rendering a gap.

        Authority. `input` and `resize` require the `terminal:operate` scope. A
        ticket holding only `terminal:read` may attach and receive output; an
        `input` frame on such a ticket is answered with an `error` frame carrying
        `TERMINAL_SCOPE_REQUIRED` and the socket stays open, so a read-only
        viewer is not disconnected for a stray keystroke.

        Close. The server sends `exit` when the underlying process ends, then
        closes. It closes with 1008 when the ticket is invalid, expired, already
        used, or bound to a different session or kind, and with 1011 when the
        sandbox is unreachable.
      parameters:
        - name: ticket
          in: query
          required: true
          description: |
            Single-use ticket from `createTerminalTicket`. Never log a URL
            carrying this value.
          schema:
            type: string
        - name: after
          in: query
          description: |
            Replay retained output with a sequence strictly greater than this
            value before going live. Use the last `sequence` rendered.
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - name: kind
          in: query
          required: true
          description: Must match the kind the ticket was minted for.
          schema:
            $ref: "#/components/schemas/TerminalKind"
      responses:
        "101":
          description: |
            WebSocket protocol upgrade accepted. The `Sec-WebSocket-Protocol`
            response header echoes the selected terminal protocol.
          headers:
            Sec-WebSocket-Protocol:
              schema:
                type: string
              description: Always the value of `TerminalConnection.protocol`.
        default:
          $ref: "#/components/responses/Error"
