          description: Highest sequence returned, or the supplied after cursor when the page is empty.
    TerminalKind:
      type: string
      enum: [agent, workspace]
    TerminalScope:
      type: string
      enum: [terminal:read, terminal:operate]
      description: |
        `terminal:read` receives output. `terminal:operate` additionally sends
        input and drives the grid.
    TerminalTransport:
      type: string
      enum: [websocket]
      description: |
        An enum with one member so a later transport can be added without a
        client having to guess from the URL scheme.
    TerminalProtocol:
      type: string
      enum: ["ao.terminal.v1"]
      description: |
        WebSocket subprotocol name and framing version. A client requests this
        exact value in `Sec-WebSocket-Protocol` and must close if the server
        selects anything else.
    TerminalFeature:
      type: string
      enum: [input, resize, replay, snapshot]
      description: |
        Optional protocol capabilities the listener supports for this terminal,
        independent of what the caller is *authorized* to do (that is `scopes`).
        `replay` means the `after` cursor is honoured; without it a reconnect
        starts from the live head. `snapshot` means the first `ready` frame
        carries a rendered screen the client can paint immediately.
    TerminalConnection:
      type: object
      additionalProperties: false
      required: [transport, protocol, url, kinds, features]
      properties:
        transport:
          $ref: "#/components/schemas/TerminalTransport"
        protocol:
          $ref: "#/components/schemas/TerminalProtocol"
        url:
          type: string
          format: uri
          description: |
            Absolute `wss://` (or `ws://` in development) URL to attach to. The
            client appends `ticket`, `kind`, and `after` as query parameters and
            otherwise treats the URL as opaque — it may name a listener that is
            not the control plane's origin, and it may already carry query
            parameters of its own.
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/TerminalKind"
          description: |
            Terminal kinds this session currently has. Empty means there is
            nothing to attach to yet, which is the normal answer while the
            sandbox is still provisioning.
        features:
          type: array
          items:
            $ref: "#/components/schemas/TerminalFeature"
        ticketPath:
          type: string
          description: |
            Control-plane path to `POST` for a ticket, relative to the API base
            URL. Present so a client can follow the contract without rebuilding
            the org/session path itself.
        maxFrameBytes:
          type: integer
          minimum: 1
          description: |
            Largest decoded `data` payload the listener accepts on one client
            frame. Absent means the client should not exceed 16384, which is the
            limit the worker transport routes already impose.
        heartbeatIntervalSeconds:
          type: integer
          minimum: 1
          description: |
            How often the client should send `ping`. Absent means the listener
            relies on WebSocket-level ping/pong and the client need not send
            application pings.
        ticketTtlSeconds:
          type: integer
          minimum: 1
          description: |
            Lifetime a freshly minted ticket will have, so a client can decide
            whether to pre-mint. Advisory — the ticket's own `expiresIn` is
            authoritative.
    TerminalTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresIn, scopes]
      properties:
        ticket:
          type: string
          description: |
            Single-use bearer of terminal authority. Keep it in memory, send it
            only on the attach handshake, and never log it.
        expiresIn:
          type: integer
          minimum: 1
          description: Lifetime in seconds.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TerminalScope"
          description: |
            Scopes actually granted, which may be narrower than those requested.
            A client renders a read-only terminal when `terminal:operate` is
            absent rather than letting the user type into a socket that will
            reject the frame.
        expiresAt:
          type: string
          format: date-time
          description: |
            Absolute expiry, for clients that would rather not depend on their
            own clock offset when scheduling a re-mint. Absent means compute it
            from `expiresIn`.
        sessionId:
          type: string
          format: uuid
          description: |
            Session the ticket is bound to. Echoed so a client holding several
            pending tickets cannot attach one to the wrong socket.
        kind:
          $ref: "#/components/schemas/TerminalKind"
          description: Terminal kind the ticket is bound to.
        connection:
          $ref: "#/components/schemas/TerminalConnection"
          description: |
            The same metadata `getTerminalConnection` returns, so minting a
            ticket and learning where to attach is one round trip. Absent means
            the client must call `getTerminalConnection`.
        lastSequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            Sequence at the head of the retained output buffer when the ticket
            was minted. A client opening a terminal for the first time can pass
            it as `after` to skip the backlog, or ignore it to replay.
    TerminalClientFrame:
      description: |
        One JSON text message from client to listener on the
        `ao.terminal.v1` protocol.
      oneOf:
        - $ref: "#/components/schemas/TerminalInputFrame"
        - $ref: "#/components/schemas/TerminalResizeFrame"
        - $ref: "#/components/schemas/TerminalPingFrame"
      discriminator:
        propertyName: type
        mapping:
          input: "#/components/schemas/TerminalInputFrame"
          resize: "#/components/schemas/TerminalResizeFrame"
          ping: "#/components/schemas/TerminalPingFrame"
    TerminalInputFrame:
      type: object
      additionalProperties: false
      required: [type, data]
      description: Keystrokes for the PTY. Requires the `terminal:operate` scope.
      properties:
        type:
          type: string
          const: input
        data:
          type: string
          contentEncoding: base64
          minLength: 1
          description: |
            Base64-encoded input, at most `maxFrameBytes` (default 16384) after
            decoding.
    TerminalResizeFrame:
      type: object
      additionalProperties: false
      required: [type, columns, rows]
      description: |
        Request the PTY grid. Requires the `terminal:operate` scope. A terminal
        has one grid; when several clients are attached the listener applies the
        most recent request and echoes the authoritative grid back to everyone
        as a server `resize`.
      properties:
        type:
          type: string
          const: resize
        columns:
          type: integer
          minimum: 1
          maximum: 65535
        rows:
          type: integer
          minimum: 1
          maximum: 65535
    TerminalPingFrame:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        Application-level liveness for clients that cannot observe
        WebSocket-level pong. Answered with `pong`.
      properties:
        type:
          type: string
          const: ping
    TerminalServerFrame:
      description: |
        One JSON text message from listener to client on the
        `ao.terminal.v1` protocol.
      oneOf:
        - $ref: "#/components/schemas/TerminalReadyFrame"
        - $ref: "#/components/schemas/TerminalOutputFrame"
        - $ref: "#/components/schemas/TerminalServerResizeFrame"
        - $ref: "#/components/schemas/TerminalExitFrame"
        - $ref: "#/components/schemas/TerminalErrorFrame"
        - $ref: "#/components/schemas/TerminalPongFrame"
      discriminator:
        propertyName: type
        mapping:
          ready: "#/components/schemas/TerminalReadyFrame"
          output: "#/components/schemas/TerminalOutputFrame"
          resize: "#/components/schemas/TerminalServerResizeFrame"
          exit: "#/components/schemas/TerminalExitFrame"
          error: "#/components/schemas/TerminalErrorFrame"
          pong: "#/components/schemas/TerminalPongFrame"
    TerminalReadyFrame:
      type: object
      additionalProperties: false
      required: [type, sequence, scopes]
      description: |
        Always the first server frame. `sequence` is the head of the retained
        buffer: when it is lower than the `after` the client asked for, the
        buffer was truncated and the client must clear its screen rather than
        render a gap.
      properties:
        type:
          type: string
          const: ready
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TerminalScope"
          description: |
            Scopes the listener resolved for this attachment, restating the
            ticket's grant so the client never has to hold the mint response to
            know whether it may type.
        columns:
          type: integer
          minimum: 1
          maximum: 65535
        rows:
          type: integer
          minimum: 1
          maximum: 65535
        snapshot:
          type: string
          contentEncoding: base64
          description: |
            Rendered screen the client can paint before any `output` arrives.
            Present only when the listener advertises the `snapshot` feature.
    TerminalOutputFrame:
      type: object
      additionalProperties: false
      required: [type, sequence, data]
      properties:
        type:
          type: string
          const: output
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            Strictly increasing across the terminal's lifetime. Reconnect with
            the last value rendered as `after`.
        data:
          type: string
          contentEncoding: base64
          minLength: 1
          description: Base64-encoded PTY output.
    TerminalServerResizeFrame:
      type: object
      additionalProperties: false
      required: [type, columns, rows]
      description: |
        The authoritative PTY grid, pushed whenever it changes. A client that
        did not request this size renders to it anyway rather than shrinking the
        shared PTY.
      properties:
        type:
          type: string
          const: resize
        columns:
          type: integer
          minimum: 1
          maximum: 65535
        rows:
          type: integer
          minimum: 1
          maximum: 65535
    TerminalExitFrame:
      type: object
      additionalProperties: false
      required: [type, exitCode]
      description: The process ended. The listener closes the socket after this frame.
      properties:
        type:
          type: string
          const: exit
        exitCode:
          type: integer
    TerminalErrorFrame:
      type: object
      additionalProperties: false
      required: [type, code, message]
      description: |
        A frame was rejected. The socket stays open unless the listener also
        closes it, so a rejected keystroke does not cost the client its
        attachment.
      properties:
        type:
          type: string
          const: error
        code:
          type: string
          description: |
            Same vocabulary as `ErrorEnvelope.code`, so a client maps terminal
            failures with the rules it already has.
        message:
          type: string
    TerminalPongFrame:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: pong
    WorkspaceEntry:
