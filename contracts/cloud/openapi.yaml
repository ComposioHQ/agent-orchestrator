          type: boolean
    WorkerTerminalCloseResult:
      type: object
      additionalProperties: false
      required: [closed]
      properties:
        closed:
          type: boolean
    WorkerTerminalResizeResult:
      type: object
      additionalProperties: false
      required: [resized]
      properties:
        resized:
          type: boolean
    WorkerWorkspaceListTransport:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        kind:
          type: string
          const: workspace.list
        payload:
          $ref: "#/components/schemas/WorkerWorkspaceListPayload"
    WorkerWorkspaceReadTransport:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        kind:
          type: string
          const: workspace.read
        payload:
          $ref: "#/components/schemas/WorkerWorkspaceReadPayload"
    WorkerWorkspaceWriteTransport:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        kind:
          type: string
          const: workspace.write
        payload:
          $ref: "#/components/schemas/WorkerWorkspaceWritePayload"
    WorkerWorkspaceDiffTransport:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        kind:
          type: string
          const: workspace.diff
        payload:
          $ref: "#/components/schemas/EmptyObject"
    WorkerTerminalOpenTransport:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        kind:
          type: string
          const: terminal.open
        payload:
          $ref: "#/components/schemas/WorkerTerminalOpenPayload"
    WorkerTerminalInputTransport:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        kind:
          type: string
          const: terminal.input
        payload:
          $ref: "#/components/schemas/WorkerTerminalInputPayload"
    WorkerTerminalResizeTransport:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        kind:
          type: string
          const: terminal.resize
        payload:
          $ref: "#/components/schemas/WorkerTerminalResizePayload"
    WorkerTerminalCloseTransport:
      type: object
      additionalProperties: false
      required: [id, kind, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        kind:
          type: string
          const: terminal.close
        payload:
          $ref: "#/components/schemas/WorkerTerminalClosePayload"
    WorkerTransportRequest:
      oneOf:
        - $ref: "#/components/schemas/WorkerWorkspaceListTransport"
        - $ref: "#/components/schemas/WorkerWorkspaceReadTransport"
        - $ref: "#/components/schemas/WorkerWorkspaceWriteTransport"
        - $ref: "#/components/schemas/WorkerWorkspaceDiffTransport"
        - $ref: "#/components/schemas/WorkerTerminalOpenTransport"
        - $ref: "#/components/schemas/WorkerTerminalInputTransport"
        - $ref: "#/components/schemas/WorkerTerminalResizeTransport"
        - $ref: "#/components/schemas/WorkerTerminalCloseTransport"
      discriminator:
        propertyName: kind
    WorkerClaimTransportResponse:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          oneOf:
            - $ref: "#/components/schemas/WorkerTransportRequest"
            - type: "null"
    WorkerTransportResult:
      type: object
      additionalProperties: true
      description: |
        The server accepts any non-null JSON object. Built-in workers return a
        WorkerWorkspaceEntryPage, WorkspaceFile, WorkspaceDiff,
        WorkerTerminalOpenResult, WorkerTerminalInputResult, or
        WorkerTerminalCloseResult appropriate to the claimed command.
    WorkerCompleteTransportInput:
      type: object
      additionalProperties: false
      required: [attempt, response]
      properties:
        attempt:
          type: integer
          minimum: 1
        response:
          $ref: "#/components/schemas/WorkerTransportResult"
    WorkerFailTransportInput:
      type: object
      additionalProperties: false
      required: [attempt, code, message]
      properties:
        attempt:
          type: integer
          minimum: 1
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          description: Worker-safe failure message, limited by the server to 4 KiB.
    WorkerAgentTerminalResponse:
      type: object
      additionalProperties: false
      required: [terminalId]
      properties:
        terminalId:
          type: string
          format: uuid
    WorkerTerminalExitInput:
      type: object
      additionalProperties: false
      required: [exitCode]
      properties:
        exitCode:
          type: integer
    WorkerTerminalOutputInput:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: string
          contentEncoding: base64
          minLength: 1
          description: Base64-encoded output frame, at most 16 KiB after decoding.
    WorkerTerminalOutputResponse:
      type: object
      additionalProperties: false
      required: [sequence]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    DeleteSessionResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          type: object
          additionalProperties: false
          required: [id, desiredState]
          properties:
            id:
              type: string
              format: uuid
            desiredState:
              type: string
              const: deleted
    WorkerChildSession:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - kind
        - harness
        - displayName
        - branch
        - activityState
        - status
        - isTerminated
        - createdAt
        - updatedAt
      description: |
        The minimum a worker orchestrator needs to reason about a child session
        it spawned. It is deliberately **not** a product DTO and must never grow
        into one: the product contract for sessions is the app API's own session
        record at `/api/v1`, and a second user-facing session type here is what
        created the `mode` collision this schema was cut down to remove.

        Nothing on it describes presentation, and nothing on it names or hints
        at a compute vendor. A client rendering a session reads the app API.
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SessionKind"
        harness:
          type: string
        displayName:
          type: string
        branch:
          type: string
        activityState:
          $ref: "#/components/schemas/SessionActivityState"
        status:
          $ref: "#/components/schemas/SessionStatus"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AgentCapability"
        isTerminated:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkerChildSessionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkerChildSession"
        page:
          $ref: "#/components/schemas/PageInfo"
    UserMessageEvent:
      type: object
      additionalProperties: false
      required: [sessionId, sequence, type, payload, createdAt]
      properties:
        sessionId:
          type: string
        sequence:
          type: integer
          format: int64
          maximum: 9007199254740991
        type:
          const: chat.user_message
        payload:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text:
              type: string
        createdAt:
          type: string
          format: date-time
    TerminalKind:
      type: string
      enum: [agent, workspace]
    TerminalScope:
      type: string
      enum: [terminal:read, terminal:operate]
      description: |
        `terminal:read` receives output. `terminal:operate` additionally sends
        input and drives the grid.
    TerminalTransport:
      type: string
      enum: [websocket]
      description: |
        An enum with one member so a later transport can be added without a
        client having to guess from the URL scheme.
    TerminalProtocol:
      type: string
      enum: ["ao.mux.v1"]
      description: |
        WebSocket subprotocol naming the framing version. This is the local
        daemon's terminal mux protocol, not a Cloud-specific one: the same
        channel-tagged frames, the same field names, so the xterm client that
        already talks to a local daemon attaches to a hosted session unchanged.

        A client offers this value in `Sec-WebSocket-Protocol` and must close if
        the server selects anything else.
    TerminalFeature:
      type: string
      enum: [input, resize, replay, snapshot]
      description: |
        Optional protocol capabilities the listener supports for this terminal,
        independent of what the caller is *authorized* to do (that is `scopes`).
        `replay` means the `after` cursor is honoured; without it a reconnect
        starts from the live head. `snapshot` means the first `ready` frame
        carries a rendered screen the client can paint immediately.
    TerminalConnection:
      type: object
      additionalProperties: false
      required: [transport, protocol, url, kinds, features]
      properties:
        transport:
          $ref: "#/components/schemas/TerminalTransport"
        protocol:
          $ref: "#/components/schemas/TerminalProtocol"
        ticketSubprotocolPrefix:
          type: string
          description: |
            Prefix the client prepends to the ticket to form the credential
            subprotocol — `ao.ticket.` — offered alongside `protocol` on the
            handshake. Reported rather than assumed so the pair can be versioned
            together. Absent means `ao.ticket.`.
        url:
          type: string
          format: uri
          description: |
            Absolute `wss://` (or `ws://` in development) URL to attach to. The
            client appends `ticket`, `kind`, and `after` as query parameters and
            otherwise treats the URL as opaque — it may name a listener that is
            not the control plane's origin, and it may already carry query
            parameters of its own.
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/TerminalKind"
          description: |
            Terminal kinds this session currently has. Empty means there is
            nothing to attach to yet, which is the normal answer while the
            sandbox is still provisioning.
        features:
          type: array
          items:
            $ref: "#/components/schemas/TerminalFeature"
        ticketPath:
          type: string
          description: |
            Control-plane path to `POST` for a ticket, relative to the API base
            URL. Present so a client can follow the contract without rebuilding
            the org/session path itself.
        maxFrameBytes:
          type: integer
          minimum: 1
          description: |
            Largest decoded `data` payload the listener accepts on one client
            frame. Absent means the client should not exceed 16384, which is the
            limit the worker transport routes already impose.
        heartbeatIntervalSeconds:
          type: integer
          minimum: 1
          description: |
            How often the client should send `ping`. Absent means the listener
            relies on WebSocket-level ping/pong and the client need not send
            application pings.
        ticketTtlSeconds:
          type: integer
          minimum: 1
          description: |
            Lifetime a freshly minted ticket will have, so a client can decide
            whether to pre-mint. Advisory — the ticket's own `expiresIn` is
            authoritative.
    TerminalTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresIn, scopes]
      properties:
        ticket:
          type: string
          description: |
            Single-use bearer of terminal authority. It travels as the
            `ao.ticket.<opaque>` WebSocket subprotocol on the attach handshake —
            never in a URL, where it would reach proxy logs and browser history.
            Keep it in memory and never log it.
        expiresIn:
          type: integer
          minimum: 1
          description: Lifetime in seconds.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TerminalScope"
          description: |
            Scopes actually granted, which may be narrower than those requested.
            A client renders a read-only terminal when `terminal:operate` is
            absent rather than letting the user type into a socket that will
            reject the frame.
        expiresAt:
          type: string
          format: date-time
          description: |
            Absolute expiry, for clients that would rather not depend on their
            own clock offset when scheduling a re-mint. Absent means compute it
            from `expiresIn`.
        sessionId:
          type: string
          format: uuid
          description: |
            Session the ticket is bound to. Echoed so a client holding several
            pending tickets cannot attach one to the wrong socket.
        kind:
          $ref: "#/components/schemas/TerminalKind"
          description: Terminal kind the ticket is bound to.
        connection:
          $ref: "#/components/schemas/TerminalConnection"
          description: |
            The same metadata `getTerminalConnection` returns, so minting a
            ticket and learning where to attach is one round trip. Absent means
            the client must call `getTerminalConnection`.
        lastSequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            The `seq` at the head of the retained output buffer when the ticket
            was minted, where the listener keeps one. A client opening a
            terminal for the first time can pass it as `after` to skip the
            backlog, or ignore it to replay. Absent means the listener does not
            retain output, which is the local daemon's behaviour.
    WorkspaceFileWriteInput:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        content:
          type: string
          maxLength: 1048576
    ProviderName:
      type: string
      enum: [daytona, claude-code, codex, cursor]
    ProviderPublicConfig:
      type: object
      additionalProperties: false
      properties:
        apiUrl:
          type: string
          format: uri
        target:
          type: string
          enum: [us, eu]
        credentialType:
          type: string
          enum: [oauth_token, api_key, access_token]
    PutAgentProviderConnectionInput:
      type: object
      additionalProperties: false
      required: [credentialType, secret]
      properties:
        credentialType:
          type: string
          enum: [oauth_token, api_key, access_token]
        secret:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
    WorkerCredentialResponse:
      type: object
      additionalProperties: false
      required: [provider, credentialType, secret]
      properties:
        provider:
          type: string
          enum: [claude-code, codex, cursor]
        credentialType:
          type: string
          enum: [oauth_token, api_key, access_token]
        secret:
          type: string
          minLength: 1
          format: password
          readOnly: true
          description: Decrypted coding-agent secret. Never log or persist this value.
    WorkerCheckoutGrantResponse:
      type: object
      additionalProperties: false
      required: [cloneUrl, token, expiresAt]
      properties:
        cloneUrl:
          type: string
          format: uri
        token:
          type: string
          minLength: 1
          format: password
          readOnly: true
          description: Repository-scoped GitHub installation token. Never log or persist this value.
        expiresAt:
          type: string
          format: date-time
    RedactedProviderConnection:
      type: object
      additionalProperties: false
      required: [id, provider, label, config, validationState, createdAt, updatedAt]
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderName"
        label:
          type: string
        config:
          $ref: "#/components/schemas/ProviderPublicConfig"
        validationState:
          type: string
          enum: [pending, valid, invalid]
        validatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
