openapi: 3.1.0
info:
  title: AO Cloud Public API
  version: 1.0.0
  description: |
    Control-plane contract for AO Cloud: authentication, organization
    administration, project **placement**, terminal ticket minting, SCM
    installation, and the worker/compute-plane API.

    ## This is not the product API

    **The product contract is the generated app OpenAPI at `/api/v1`**
    (`backend/internal/httpd/apispec/openapi.yaml`). Once a project exists,
    every product read and mutation — sessions, messages, events, pull
    requests, reviews, workspace files — goes to those routes, with their exact
    existing DTOs and controller semantics. A hosted deployment mounts them
    unchanged; it does not restate them here.

    This document deliberately contains no `Session` schema, no session product
    routes, and no workspace or event routes. An earlier draft did, and it was
    wrong twice over: it duplicated an API that already existed, and its second
    user-facing session type collided with the app's — Cloud's `mode` meant a
    permission mode while the app's meant chat-versus-TUI. The duplicate type
    was deleted rather than reconciled, which removes the collision at its
    source. `WorkerChildSession` is the one remaining session record; it exists
    for worker orchestration, carries nothing about presentation, and must not
    grow into a product DTO.

    What stays here is what a local daemon has no equivalent for: who you are,
    which organization you act in, where a project is provisioned and how to
    resume it, the credential that lets a client attach to a terminal, and the
    GitHub App installation that grants repository access.

    ## Conventions

    **Authentication.** Every route takes `Authorization: Bearer <accessToken>`
    from the AO session issued by `exchangeGoogleIdentity` or
    `refreshAOSession`. The exceptions are deliberate and marked `security: []`:
    the three auth routes themselves, the GitHub callback, `connectTerminal`
    (a WebSocket handshake cannot carry headers, so it uses a single-use
    ticket), and the worker routes, which use their own `Worker` credential.

    **Tenant scoping.** On these control-plane routes the organization is in the
    path, because here the organization *is* the resource being administered. A
    caller without a membership in `{orgId}` gets the same answer as one asking
    for an org that does not exist, so the surface cannot be used to probe for
    tenants. Account-wide routes (`/me`, `/github/user`) have no `{orgId}`
    because they describe the user rather than a tenant.

    Hosted **app** routes at `/api/v1` scope differently: they carry `X-AO-Org`
    after the bearer token, holding an organization id or slug, and middleware
    verifies an active membership and injects the tenant context. The header is
    needed only when the caller belongs to more than one organization — a single
    active membership resolves without it. Project and session identifiers stay
    exactly where they already are in those routes and bodies, and the stores
    enforce workspace ownership. A local daemon serves the same routes with no
    header and no tenant, which is what keeps local AO a complete product rather
    than a degraded cloud client. See the `OrganizationHeader` parameter.

    **No vendor names.** Nothing a user can see names, or hints at, a compute
    provider. There is no sandbox provider, provider-assigned identifier,
    region, or workspace identifier on any client-facing DTO. Generic
    provisioning status lives only on the placement DTO, as
    `Project.lifecycleState`. The organization-admin provider-connection routes
    name providers because configuring one is their entire purpose.

    **Errors.** Every non-2xx response is an `ErrorEnvelope`, including the
    WebSocket upgrade failures. `code` is the stable machine-readable value —
    branch on it, never on `message`, which is prose and may change. `requestId`
    is what to quote in a support request.

    **Pagination.** List routes take `cursor` and `limit` and answer with
    `{items, page}`, where `page.nextCursor` is present only while
    `page.hasMore` is true. Cursors are opaque and single-use for a given
    ordering — never construct or persist one.

    **Idempotency.** Placement create, delete and resume require
    `Idempotency-Key`, as do the provisioning routes that create a project from
    GitHub. Replaying a key with the same command returns the original result,
    so a client that lost the response can retry without provisioning a second
    workspace; replaying it with a different command is `IDEMPOTENCY_CONFLICT`.

    **Local defaults in prose.** Where a field has a documented default, it is
    stated in the description rather than as a schema `default:`.
    `openapi-typescript` promotes a defaulted response property to a *required*
    one, which would defeat the purpose of an optional field.
security:
  - bearerAuth: []
tags:
  - name: Account
  - name: Agents
  - name: Projects
    description: Project placement — provisioning and discovery, not product reads.
  - name: GitHub
  - name: Terminal
  - name: Providers
  - name: Worker Lifecycle
  - name: Worker Execution
  - name: Worker Orchestration
  - name: Worker Transport
paths:
  /api/cloud/v1/auth/google:
    post:
      operationId: exchangeGoogleIdentity
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleIdentityExchange"
      responses:
        "200":
          description: Google identity verified and an AO session issued.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AOSession"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/auth/refresh:
    post:
      operationId: refreshAOSession
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: The refresh token was consumed and replaced atomically without extending the session's absolute expiry.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AOSession"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/auth/logout:
    post:
      operationId: logoutAOSession
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204":
          description: The refresh token was revoked. AO access tokens expire naturally.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/me:
    get:
      operationId: getCurrentAccount
      tags: [Account]
      responses:
        "200":
          description: The authenticated user and their active organization memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user:
    get:
      operationId: getGitHubUserConnection
      tags: [GitHub]
      responses:
        "200":
          description: The authenticated user's account-wide GitHub connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserConnection"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: disconnectGitHubUser
      tags: [GitHub]
      responses:
        "204":
          description: The account-wide GitHub authorization was revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user/authorize:
    post:
      operationId: startGitHubUserAuthorization
      tags: [GitHub]
      responses:
        "201":
          description: A short-lived account-wide GitHub authorization attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserAuthorizationStart"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/github/user/callback:
    get:
      operationId: completeGitHubUserAuthorization
      tags: [GitHub]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: GitHub authorization completion page.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/agents:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listAgents
      tags: [Agents]
      responses:
        "200":
          description: Agent profiles supplied by the runtime and organization host.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentProfile"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listProjects
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of projects in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [Projects]
      description: |
        Read one project placement the caller's organization owns.

        This is placement discovery, not a product read: it answers where a
        project is provisioned and what state that provisioning is in. Anything
        a user sees about the project — its name, its settings, its sessions —
        comes from the app API's own project routes at `/api/v1`.
      responses:
        "200":
          description: Project details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Archive the project and tear down its cloud workspace. The call is
        idempotent under `Idempotency-Key`: a retry of the same key returns the
        original result rather than reporting a missing project, so a client
        that loses the response can safely repeat it.
      responses:
        "202":
          description: Project archived and sandbox teardown accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/{projectId}/resume:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: resumeProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Bring a `suspended` project's cloud workspace back online so its
        sessions can run again. Resume is asynchronous: the response carries the
        project with `lifecycleState` set to `provisioning` (or already `ready`
        when nothing needed starting), and the client observes completion by
        re-reading the project or by the session events of the sessions it cares
        about.

        Resuming a `ready` project is a no-op that returns the project
        unchanged. Resuming an `archived` project fails with
        `PROJECT_ARCHIVED` — archived projects are re-created, not resumed.

        Local AO has no suspended state, so its projects are always `ready` and
        the local adapter never issues this call.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeProjectInput"
      responses:
        "202":
          description: Workspace resume accepted, or the project was already running.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubInstallations
      tags: [GitHub]
      responses:
        "200":
          description: GitHub App installations connected to the organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/start:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: startGitHubInstallation
      tags: [GitHub]
      responses:
        "201":
          description: A short-lived GitHub App installation attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationStart"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/sync:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: syncGitHubInstallation
      tags: [GitHub]
      responses:
        "202":
          description: Repository synchronization accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: disconnectGitHubInstallation
      tags: [GitHub]
      responses:
        "200":
          description: The GitHub App installation was disconnected from AO.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/repositories:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubRepositories
      tags: [GitHub]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of repositories currently or historically granted to the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/projects:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createProjectFromGitHub
      tags: [GitHub, Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubProjectInput"
      responses:
        "201":
          description: Project created from an actively granted GitHub repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects/scratch:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createGitHubScratchProject
      tags: [GitHub, Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubScratchProjectInput"
      responses:
        "201":
          description: GitHub repository, AO project, and first orchestrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGitHubScratchProjectResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/terminal-ticket:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createTerminalTicket
      tags: [Terminal]
      description: |
        Mint the credential for one terminal attachment and return, alongside
        it, everything needed to make the connection.

        The handoff is deliberately two-credential: the bearer token proves who
        the caller is to the control plane and never leaves it, and the ticket
        is what travels to the terminal listener. The ticket is single-use,
        short-lived, and bound to this session, this `kind`, and the scopes
        granted below, so a leaked query string cannot be replayed and cannot
        reach another session.

        `scopes` in the request is a *request*, not an assertion. The server
        grants the intersection of what was asked for and what the caller's
        organization role allows, and the response reports what was actually
        granted. Asking for nothing asks for the caller's full authority. Asking
        for a scope the caller does not hold is not an error — the scope is
        simply absent from the response, so a read-only viewer degrades to a
        read-only terminal instead of failing to open one.

        The response embeds the same `TerminalConnection` that
        `getTerminalConnection` returns, so a client that already intends to
        attach needs exactly one round trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/TerminalKind"
                scopes:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/TerminalScope"
                  description: |
                    Scopes the client intends to use. Absent requests the
                    caller's full authority for this session.
      responses:
        "201":
          description: Short-lived, single-use terminal access ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalTicket"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/terminal:
    get:
      operationId: connectTerminal
      tags: [Terminal]
      summary: Attach to a session terminal over the mux WebSocket.
      security: []
      description: |
        Attach to a hosted session's terminal. The framing is the local daemon's
        terminal mux (`MuxClientFrame` / `MuxServerFrame`): the same channels,
        the same field names, so the xterm client that already talks to a local
        daemon attaches here unchanged.

        **The credential travels as a WebSocket subprotocol, not a query
        parameter.** A browser cannot set headers on a handshake, and a query
        string ends up in proxy logs, browser history and referrers — a ticket
        there is a credential written to disk in three places. So the client
        offers two subprotocols:

        ```
        Sec-WebSocket-Protocol: ao.mux.v1, ao.ticket.<opaque>
        ```

        where `<opaque>` is the `ticket` value from `createTerminalTicket`,
        verbatim. The server authenticates from the `ao.ticket.` entry and
        selects **only** `ao.mux.v1` in its response, so the credential is never
        echoed back. A client that sees anything other than `ao.mux.v1` selected
        must close rather than guess a framing.

        Attach to the `url` reported on the ticket's `connection`. It may name a
        listener that is not the control plane's origin, so do not rebuild it
        from the API base URL.

        Authority. `data` and `resize` frames require the `terminal:operate`
        scope. A ticket holding only `terminal:read` may attach and receive
        output; an operate frame on such a ticket is answered with a
        `terminal`/`error` frame and the socket stays open, so a read-only
        viewer is not disconnected for a stray keystroke.

        Close. The listener closes with 1008 when the ticket is invalid,
        expired, already used, or bound to a different session, and with 1011
        when the sandbox is unreachable.
      parameters:
        - name: after
          in: query
          description: |
            Replay retained output with a `seq` strictly greater than this value
            before going live, where the listener keeps a replay buffer. Use the
            last `seq` rendered. Omit — or pass 0 — to take whatever the
            listener offers, which for a local daemon is the live stream only.
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
            default: 0
      responses:
        "101":
          description: |
            WebSocket upgrade accepted. `Sec-WebSocket-Protocol` echoes
            `ao.mux.v1` alone — never the ticket subprotocol.
          headers:
            Sec-WebSocket-Protocol:
              schema:
                type: string
              description: Always `ao.mux.v1`.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/provider-connections:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listProviderConnections
      tags: [Providers]
      responses:
        "200":
          description: Redacted provider connection metadata. Secrets are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [providerConnections]
                properties:
                  providerConnections:
                    type: array
                    items:
                      $ref: "#/components/schemas/RedactedProviderConnection"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/provider-connections/agents/{provider}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [claude-code, codex, cursor]
    put:
      operationId: putAgentProviderConnection
      tags: [Providers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAgentProviderConnectionInput"
      responses:
        "200":
          description: The validated coding-agent credential was encrypted and stored.
          content:
            application/json:
              schema:
                type: object
                required: [providerConnection]
                properties:
                  providerConnection:
                    $ref: "#/components/schemas/RedactedProviderConnection"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAgentProviderConnection
      tags: [Providers]
      responses:
        "204":
          description: The coding-agent credential was disconnected.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/bootstrap:
    post:
      operationId: bootstrapWorker
      tags: [Worker Lifecycle]
      security: []
      summary: Redeem a one-time bootstrap ticket.
      description: |
        The bootstrap token is consumed atomically and cannot be replayed. A
        successful response assigns the worker epoch and returns the first
        short-lived worker token. The token carries the ticket's scopes and
        must never be logged or persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerBootstrapInput"
      responses:
        "200":
          description: Bootstrap succeeded and the one-time ticket was consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerBootstrapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The bootstrap token is missing, invalid, expired, or already used.
          $ref: "#/components/responses/Error"
        "404":
          description: Worker bootstrap is not enabled on this deployment.
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/heartbeat:
    post:
      operationId: heartbeatWorker
      tags: [Worker Lifecycle]
      security:
        - workerAuth: []
      description: |
        Records worker liveness, promotes a bootstrapping sandbox to running,
        and returns a newly issued token for the same worker identity, epoch,
        and scopes. The prior token is not revoked by renewal and remains valid
        until it expires unless the worker epoch is replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatInput"
      responses:
        "200":
          description: Liveness was recorded and a replacement token was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerHeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
        "500":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/events:
    post:
      operationId: publishWorkerEvent
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Publishes one allowlisted event. `agent.activity` carries an explicit
        coding-agent lifecycle hook signal. `worker.ready` must identify the
        authenticated worker and epoch. `chat.assistant_delta` is fenced by both
        the token epoch and the claimed turn attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerEventInput"
      responses:
        "202":
          description: The event was durably accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The turn has finished or another epoch or attempt owns it.
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/turns/claim:
    post:
      operationId: claimWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Atomically claims the oldest queued turn for the authenticated worker's
        session. Reclaiming work from an older worker epoch increments
        `attempt`. No server lease identifier or expiry is returned. An empty
        queue is represented by HTTP 200 with `turn: null`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: The claimed turn, or null when no turn is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerClaimTurnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
  /api/cloud/v1/worker/turns/{turnId}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    get:
      operationId: getWorkerTurnCancellation
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Returns cancellation intent only if the token epoch and supplied
        positive attempt still own the active turn.
      parameters:
        - $ref: "#/components/parameters/WorkerTurnAttempt"
      responses:
        "200":
          description: Current cancellation state for this fenced attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCancellationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The turn has finished or another epoch or attempt owns it.
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/turns/{turnId}/complete:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: completeWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Completes the exact claimed attempt. `cancelled: true` records an
        interrupted completion. Repeating the same callback after that attempt
        has finished succeeds with `alreadyFinished: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCompleteTurnInput"
      responses:
        "200":
          description: The fenced completion was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerFinishTurnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Another epoch or attempt owns the turn.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/turns/{turnId}/fail:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: failWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Fails the exact claimed attempt with a non-empty error message. A
        repeated callback for the same finished attempt is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailTurnInput"
      responses:
        "200":
          description: The fenced failure was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerFinishTurnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Another epoch or attempt owns the turn.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/credential:
    get:
      operationId: getWorkerCredential
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Returns the valid default coding-agent credential selected by the
        session harness. The secret must never be logged or persisted.
      responses:
        "200":
          description: The decrypted session-scoped coding-agent credential.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCredentialResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/checkout-grant:
    post:
      operationId: createWorkerCheckoutGrant
      tags: [Worker Execution]
      security:
        - workerAuth: []
      description: |
        Brokers a fresh repository-scoped GitHub installation token. Repository
        identity is derived from the worker session and cannot be supplied by
        the sandbox. The token must never be logged or persisted.
      responses:
        "200":
          description: A short-lived checkout grant.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCheckoutGrantResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/children:
    get:
      operationId: listWorkerChildren
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      description: Creates a trusted child by default and passes its required prompt directly to the coding-agent launch command.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of direct child sessions owned by this orchestrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerChildSessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createWorkerChild
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerChildInput"
      responses:
        "201":
          description: A worker child was created under this orchestrator.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/WorkerChildSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/children/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: deleteWorkerChild
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      description: Requests deletion of a direct child owned by the authenticated orchestrator.
      responses:
        "202":
          description: Child sandbox deletion was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/children/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: sendWorkerChildMessage
      tags: [Worker Orchestration]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "202":
          description: The message was durably appended to the direct child.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/UserMessageEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/transport/claim:
    post:
      operationId: claimWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Claims the next durable workspace or terminal command for the token's
        session and epoch. The internal claim lasts 10 seconds and may be
        reclaimed up to three times. The positive claim attempt is returned and
        must be echoed by completion or failure callbacks. No work is represented
        by HTTP 200 with `request: null`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: The claimed command, or null when none is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerClaimTransportResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "404":
          $ref: "#/components/responses/WorkerRoutesDisabled"
  /api/cloud/v1/worker/transport/{requestId}/complete:
    parameters:
      - $ref: "#/components/parameters/WorkerRequestId"
    post:
      operationId: completeWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Completes a claimed durable command. The worker token epoch, request
        status, request expiry, and positive claim attempt are checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCompleteTransportInput"
      responses:
        "200":
          description: The command result was durably recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The command is no longer claimed or has expired.
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/transport/{requestId}/fail:
    parameters:
      - $ref: "#/components/parameters/WorkerRequestId"
    post:
      operationId: failWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Records a bounded machine-readable error for a claimed command. The
        token epoch, request status, expiry, and positive claim attempt are
        checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailTransportInput"
      responses:
        "200":
          description: The command failure was durably recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The command is no longer claimed or has expired.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/terminals/agent:
    post:
      operationId: ensureWorkerAgentTerminal
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: Returns the epoch-scoped persistent terminal used by the interactive agent TUI.
      responses:
        "200":
          description: The agent terminal is ready for process attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerAgentTerminalResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/terminals/{terminalId}/output:
    parameters:
      - $ref: "#/components/parameters/TerminalId"
    post:
      operationId: publishWorkerTerminalOutput
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Appends one base64-encoded output frame to a live workspace terminal.
        The terminal and worker token must have the same current epoch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerTerminalOutputInput"
      responses:
        "202":
          description: The output frame was appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerTerminalOutputResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The terminal is closed, expired, over quota, or no longer current.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/terminals/{terminalId}/exit:
    parameters:
      - $ref: "#/components/parameters/TerminalId"
    post:
      operationId: publishWorkerTerminalExit
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: Marks the epoch-scoped agent or workspace terminal process as exited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerTerminalExitInput"
      responses:
        "200":
          description: The terminal exit was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Session-scoped credential formatted as `Worker <token>`. Every
        authenticated route verifies both the token signature and that its
        worker ID and epoch are still current. Replacing a sandbox therefore
        fences an otherwise unexpired token with `STALE_WORKER_TOKEN`.

        Route scopes are `worker:connect` for heartbeat, `worker:event` for
        events, `worker:turn:claim`, `worker:turn:poll`, and
        `worker:turn:complete` for turn execution,
        `worker:credential:read` for the agent secret, `worker:git` for a
        checkout grant, `worker:orchestrate` for child controls, and
        `worker:transport` for workspace and terminal transport.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TerminalId:
      name: terminalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerTurnAttempt:
      name: attempt
      in: query
      required: true
      description: |
        Positive claim attempt returned with the turn. Together with the epoch
        in the worker token, this fences cancellation checks, output, and the
        terminal turn callback.
      schema:
        type: integer
        minimum: 1
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    After:
      name: after
      in: query
      description: Return events with a sequence strictly greater than this value.
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        default: 0
    OrganizationHeader:
      name: X-AO-Org
      in: header
      required: false
      description: |
        Selects which organization a hosted app request under `/api/v1` acts
        within. Accepts either the organization's id or its slug — whichever the
        client has to hand. Prefer the id where you have both: a slug is
        renameable, so a persisted one can go stale.

        **Only needed when the caller belongs to more than one organization.**
        With a single active membership the header may be omitted and the
        middleware resolves that organization; with several, omitting it is an
        error rather than a guess, because picking one silently is how a request
        lands in the wrong tenant. Sending it always is harmless and is the
        simplest rule for a client that does not want to branch on membership
        count.

        The middleware verifies the bearer token's account holds an *active*
        membership before injecting the tenant context the stores scope by. A
        revoked or suspended membership, and an organization the caller does not
        belong to, are both answered as though the organization does not exist,
        so the header cannot be used to probe for tenants.

        Absent on a local daemon, which serves the same routes untenanted — that
        is what lets one set of components render both.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        description: Organization id (uuid) or slug.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Reusing a key with the same command returns the original result.
        Reusing it with a different command returns an IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    Error:
      description: Standard Cloud API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The JSON body, path value, query value, or required header is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: The request is syntactically valid but violates a resource constraint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerUnauthorized:
      description: |
        The `Worker` credential is absent, invalid, expired, or belongs to a
        worker epoch that has been replaced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerScopeRequired:
      description: The worker token does not contain the scope required by this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerRoutesDisabled:
      description: Worker routes are not enabled on this deployment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
    AuthProvider:
      type: string
      enum: [google, workos, local]
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, authProvider]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        authProvider:
          $ref: "#/components/schemas/AuthProvider"
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [id, slug, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/OrganizationRole"
    CurrentAccount:
      type: object
      additionalProperties: false
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
    GoogleIdentityExchange:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 65536
          description: Google OpenID Connect ID token obtained through desktop PKCE.
    RefreshTokenInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          pattern: "^ao_refresh_"
    AOSession:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt, user, organizations]
      properties:
        accessToken:
          type: string
          description: Short-lived AO bearer token; never expose it to renderer storage.
        refreshToken:
          type: string
          pattern: "^ao_refresh_"
          description: Rotating opaque token for protected Electron-main storage.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/CurrentUser"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
    AgentCapability:
      type: string
      enum:
        - interface.chat
        - interface.tui
        - model.catalog
        - model.custom
        - attachments
        - browser.preview
        - review.execute
        - session.resume
    AgentInstallationState:
      type: string
      enum: [installed, not_installed, unknown, not_applicable]
    AgentAuthenticationState:
      type: string
      enum: [authorized, unauthorized, unknown, not_applicable]
    AgentOrganizationPolicy:
      type: string
      enum: [not_applicable, allowed, denied]
    AgentAvailability:
      type: object
      additionalProperties: false
      required: [available, installation, authentication, organizationPolicy]
      properties:
        available:
          type: boolean
          description: Effective host readiness after installation, authentication, and organization policy.
        installation:
          $ref: "#/components/schemas/AgentInstallationState"
        authentication:
          $ref: "#/components/schemas/AgentAuthenticationState"
        organizationPolicy:
          $ref: "#/components/schemas/AgentOrganizationPolicy"
        reason:
          type: string
          description: Host-supplied explanation when the agent is unavailable.
    AgentProfile:
      type: object
      additionalProperties: false
      required: [id, label, capabilities, availability]
      properties:
        id:
          type: string
        label:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AgentCapability"
        availability:
          $ref: "#/components/schemas/AgentAvailability"
    ErrorEnvelope:
      type: object
      additionalProperties: false
