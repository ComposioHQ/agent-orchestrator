          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activity:
          $ref: "#/components/schemas/SessionActivity"
          description: |
            Same `{state, lastActivityAt}` shape the local `/api/v1` session
            carries, so a component that already reads `session.activity`
            renders a Cloud session unchanged. Absent means the client derives
            it from `activityState` and `updatedAt`.
        interfaceMode:
          $ref: "#/components/schemas/SessionInterfaceMode"
          description: Absent means `chat`.
        model:
          type: string
          maxLength: 200
          description: |
            Model the harness is running, when the harness reports one. Absent
            means the harness default.
        issueId:
          type: string
          maxLength: 200
          description: Tracker issue this session was spawned for, when there was one.
        isPinned:
          type: boolean
          description: Absent means false.
        pinnedAt:
          type: [string, "null"]
          format: date-time
        terminateOnPrMerge:
          type: boolean
          description: Absent means false.
        autoReviewEnabled:
          type: boolean
          description: Absent means the project setting applies.
        autoInjectReview:
          type: boolean
          description: Absent means false.
        autoInjectCI:
          type: boolean
          description: Absent means false.
        terminatedAt:
          type: string
          format: date-time
          description: Present only while `isTerminated` is true.
        workspaceId:
          type: string
          format: uuid
          description: |
            Cloud workspace the session's sandbox belongs to. Absent for local
            AO, and absent in Cloud before the first sandbox exists.
        sandbox:
          $ref: "#/components/schemas/SessionSandbox"
          description: |
            Compute-plane state. Absent for local AO, whose sessions run as
            local processes with no sandbox lifecycle.
