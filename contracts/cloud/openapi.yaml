      description: |
        Cloud workspace lifecycle. `provisioning` and `suspended` are the two
        states a client must render differently from `ready`: neither can accept
        a session spawn until it reaches `ready`. Local AO projects are always
        `ready`.
    Project:
      type: object
      additionalProperties: false
      required: [id, orgId, displayName, repositoryUrl, defaultBranch, config, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
