    MuxChannel:
      type: string
      enum: [terminal, subscribe, sessions, system]
      description: |
        One socket multiplexes every logical stream, tagged by `ch`:

        - `terminal` — per-pane byte stream, keyed by the runtime handle in `id`
        - `subscribe` — the client opting into the session-state channel
        - `sessions` — server-pushed session-state changes
        - `system` — liveness; WebSocket ping/pong also runs underneath
    MuxClientFrameType:
      type: string
      enum: [open, data, resize, close, subscribe, ping]
    MuxServerFrameType:
      type: string
      enum: [opened, data, resize, exited, error, snapshot, pong]
    MuxClientFrame:
      type: object
      additionalProperties: false
      required: [ch, type]
      description: |
        One inbound frame. Fields are shared across channels; which apply
        depends on `ch` and `type`, exactly as in the local daemon's mux:

        - `terminal`/`open` — `id`, optionally `cols`, `rows`, `role`
        - `terminal`/`data` — `id`, `data`
        - `terminal`/`resize` — `id`, `cols`, `rows`, optionally `force`
        - `terminal`/`close` — `id`
        - `subscribe`/`subscribe` — no payload
        - `system`/`ping` — no payload

        `data` and `resize` require the `terminal:operate` scope. A frame sent
        without it is answered with an `error` frame and the socket stays open,
        so a read-only viewer is not disconnected for a stray keystroke.
      properties:
        ch:
          $ref: "#/components/schemas/MuxChannel"
        type:
          $ref: "#/components/schemas/MuxClientFrameType"
        id:
          type: string
          description: Opaque runtime handle for the pane, on `ch` `terminal`.
        data:
          type: string
          contentEncoding: base64
          description: |
            Base64-encoded keystrokes. Base64 because PTY bytes need not be
            valid UTF-8 and so could not survive a raw JSON string.
        cols:
          type: integer
          minimum: 1
          maximum: 65535
        rows:
          type: integer
          minimum: 1
          maximum: 65535
        force:
          type: boolean
          description: |
            Re-signal an unchanged grid for attach recovery. Duplicate frames
            are otherwise ignored so they cannot trigger another TUI repaint.
        role:
          $ref: "#/components/schemas/MuxClientRole"
    MuxClientRole:
      type: string
      enum: [secondary]
      description: |
        A pane has one grid. When several clients view it at once the primary
        drives that grid and secondaries render the authoritative size rather
        than shrinking the PTY. Unset means primary, which is what keeps
        existing clients driving the size.
    MuxServerFrame:
      type: object
      additionalProperties: false
      required: [ch, type]
      description: |
        One outbound frame, mirroring the local daemon's server frames:

        - `terminal`/`opened` — `id`
        - `terminal`/`data` — `id`, `data`, optionally `seq`
        - `terminal`/`resize` — `id`, `cols`, `rows`; the authoritative grid,
          pushed so followers render the size the PTY is actually using
        - `terminal`/`exited` — `id`
        - `terminal`/`error` — `error`, optionally `id`
        - `sessions`/`snapshot` — `session`
        - `system`/`pong` — no payload
      properties:
        ch:
          $ref: "#/components/schemas/MuxChannel"
        type:
          $ref: "#/components/schemas/MuxServerFrameType"
        id:
          type: string
        data:
          type: string
          contentEncoding: base64
          description: Base64-encoded PTY output.
        cols:
          type: integer
          minimum: 1
          maximum: 65535
        rows:
          type: integer
          minimum: 1
          maximum: 65535
        error:
          type: string
        session:
          $ref: "#/components/schemas/MuxSessionUpdate"
        seq:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            Optional monotonic cursor on a `terminal`/`data` frame. Present only
            where the listener retains a replay buffer, which a local daemon
            does not — hence optional, so the same client code works against
            both. When present, reconnect with the last value rendered as
            `after` to replay the gap; when absent, a reconnect starts live.
    MuxSessionUpdate:
      type: object
      additionalProperties: false
      required: [seq, projectId, eventType]
      description: |
        The `sessions` channel payload: one change projected to the fields a
        client needs in order to know it should refetch. It deliberately omits
        the change payload itself — detail comes from the app API.
      properties:
        seq:
          type: integer
          format: int64
        projectId:
          type: string
        sessionId:
          type: string
        eventType:
          type: string
    WorkspaceEntry:
      type: object
      additionalProperties: false
      required: [name, path, isDir, size, mode, modTime]
      description: |
