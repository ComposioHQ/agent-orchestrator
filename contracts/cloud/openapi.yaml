      description: |
        Completes a claimed durable command. The worker token epoch, request
        status, request expiry, and positive claim attempt are checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCompleteTransportInput"
      responses:
        "200":
          description: The command result was durably recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The command is no longer claimed or has expired.
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/transport/{requestId}/fail:
    parameters:
      - $ref: "#/components/parameters/WorkerRequestId"
    post:
      operationId: failWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Records a bounded machine-readable error for a claimed command. The
        token epoch, request status, expiry, and positive claim attempt are
        checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailTransportInput"
      responses:
        "200":
          description: The command failure was durably recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The command is no longer claimed or has expired.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/terminals/agent:
    post:
      operationId: ensureWorkerAgentTerminal
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: Returns the epoch-scoped persistent terminal used by the interactive agent TUI.
      responses:
        "200":
          description: The agent terminal is ready for process attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerAgentTerminalResponse"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/terminals/{terminalId}/output:
    parameters:
      - $ref: "#/components/parameters/TerminalId"
    post:
      operationId: publishWorkerTerminalOutput
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: |
        Appends one base64-encoded output frame to a live workspace terminal.
        The terminal and worker token must have the same current epoch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerTerminalOutputInput"
      responses:
        "202":
          description: The output frame was appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerTerminalOutputResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          description: The terminal is closed, expired, over quota, or no longer current.
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cloud/v1/worker/terminals/{terminalId}/exit:
    parameters:
      - $ref: "#/components/parameters/TerminalId"
    post:
      operationId: publishWorkerTerminalExit
      tags: [Worker Transport]
      security:
        - workerAuth: []
      description: Marks the epoch-scoped agent or workspace terminal process as exited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerTerminalExitInput"
      responses:
        "200":
          description: The terminal exit was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOKResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WorkerUnauthorized"
        "403":
          $ref: "#/components/responses/WorkerScopeRequired"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Session-scoped credential formatted as `Worker <token>`. Every
        authenticated route verifies both the token signature and that its
        worker ID and epoch are still current. Replacing a sandbox therefore
        fences an otherwise unexpired token with `STALE_WORKER_TOKEN`.

        Route scopes are `worker:connect` for heartbeat, `worker:event` for
        events, `worker:turn:claim`, `worker:turn:poll`, and
        `worker:turn:complete` for turn execution,
        `worker:credential:read` for the agent secret, `worker:git` for a
        checkout grant, `worker:orchestrate` for child controls, and
        `worker:transport` for workspace and terminal transport.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TerminalId:
      name: terminalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkerTurnAttempt:
      name: attempt
      in: query
      required: true
      description: |
        Positive claim attempt returned with the turn. Together with the epoch
        in the worker token, this fences cancellation checks, output, and the
        terminal turn callback.
      schema:
        type: integer
        minimum: 1
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    After:
      name: after
      in: query
      description: Return events with a sequence strictly greater than this value.
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Reusing a key with the same command returns the original result.
        Reusing it with a different command returns an IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    Error:
      description: Standard Cloud API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The JSON body, path value, query value, or required header is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: The request is syntactically valid but violates a resource constraint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerUnauthorized:
      description: |
        The `Worker` credential is absent, invalid, expired, or belongs to a
        worker epoch that has been replaced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerScopeRequired:
      description: The worker token does not contain the scope required by this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    WorkerRoutesDisabled:
      description: Worker routes are not enabled on this deployment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
    AuthProvider:
      type: string
      enum: [google, workos, local]
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, authProvider]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        authProvider:
          $ref: "#/components/schemas/AuthProvider"
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [id, slug, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/OrganizationRole"
    CurrentAccount:
      type: object
      additionalProperties: false
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
    GoogleIdentityExchange:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 65536
          description: Google OpenID Connect ID token obtained through desktop PKCE.
    RefreshTokenInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          pattern: "^ao_refresh_"
    AOSession:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt, user, organizations]
      properties:
        accessToken:
          type: string
          description: Short-lived AO bearer token; never expose it to renderer storage.
        refreshToken:
          type: string
          pattern: "^ao_refresh_"
          description: Rotating opaque token for protected Electron-main storage.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/CurrentUser"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
    AgentCapability:
      type: string
      enum:
        - interface.chat
        - interface.tui
        - model.catalog
        - model.custom
        - attachments
        - browser.preview
        - review.execute
        - session.resume
    AgentInstallationState:
      type: string
      enum: [installed, not_installed, unknown, not_applicable]
    AgentAuthenticationState:
      type: string
      enum: [authorized, unauthorized, unknown, not_applicable]
    AgentOrganizationPolicy:
      type: string
      enum: [not_applicable, allowed, denied]
    AgentAvailability:
      type: object
      additionalProperties: false
      required: [available, installation, authentication, organizationPolicy]
      properties:
        available:
          type: boolean
          description: Effective host readiness after installation, authentication, and organization policy.
        installation:
          $ref: "#/components/schemas/AgentInstallationState"
        authentication:
          $ref: "#/components/schemas/AgentAuthenticationState"
        organizationPolicy:
          $ref: "#/components/schemas/AgentOrganizationPolicy"
        reason:
          type: string
          description: Host-supplied explanation when the agent is unavailable.
    AgentProfile:
      type: object
      additionalProperties: false
      required: [id, label, capabilities, availability]
      properties:
        id:
          type: string
        label:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AgentCapability"
        availability:
          $ref: "#/components/schemas/AgentAvailability"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, code, message, requestId]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: string
    ProjectKind:
      type: string
      enum: [single_repo, workspace, scratch]
      description: |
        Matches the local `/api/v1` project kind vocabulary so a shared view
        renders a Cloud project and a local project with the same branch.
    ProjectLifecycleState:
      type: string
      enum: [provisioning, ready, suspended, archived, error]
      description: |
        Cloud workspace lifecycle. `provisioning` and `suspended` are the two
        states a client must render differently from `ready`: neither can accept
        a session spawn until it reaches `ready`. Local AO projects are always
        `ready`.
    Project:
      type: object
      additionalProperties: false
      required: [id, orgId, displayName, repositoryUrl, defaultBranch, config, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        displayName:
          type: string
        repositoryUrl:
          type: string
          format: uri
        defaultBranch:
          type: string
        githubRepositoryId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: GitHub's integer repository ID encoded as a decimal string to preserve precision.
        config:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/ProjectKind"
          description: |
            Optional so an existing single-repository Cloud project stays valid
            without a migration. Absent means `single_repo`, which is also what
            a local AO single-repository project reports.

            The default is stated here rather than as a schema `default:`
            because `openapi-typescript` promotes a defaulted response property
            to a required one, which would break the clients this field exists
            to keep working.
        agent:
          type: string
          description: |
            Default harness for sessions spawned in this project, named to match
            the local `/api/v1` project field. Absent means the organization
            default applies.
        lifecycleState:
          $ref: "#/components/schemas/ProjectLifecycleState"
          description: |
            Absent means `ready`, which is what local AO always reports. Stated
            as prose rather than a schema `default:` for the reason given on
            `kind`.
        lifecycleMessage:
          type: string
          maxLength: 2048
          description: |
            Operator-facing detail for `error` (and, when useful, for a slow
            `provisioning`). Never present when `lifecycleState` is `ready`.
        workspaceId:
          type: string
          format: uuid
          description: |
            Cloud workspace backing the project. Absent for local AO, and absent
            in Cloud until the workspace has been provisioned once.
        archivedAt:
          type: string
          format: date-time
          description: Present only once `lifecycleState` is `archived`.
    ResumeProjectInput:
      type: object
      additionalProperties: false
      properties:
        sandboxProviderConnectionId:
          type: string
          format: uuid
          description: |
            Pin the resumed workspace to one organization sandbox provider
            connection. Absent uses the organization default, which is the only
            behaviour a client needs unless the user picks a provider.
    CreateProjectInput:
      type: object
      additionalProperties: false
      required: [displayName, repositoryUrl, defaultBranch]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        repositoryUrl:
          type: string
          format: uri
          pattern: "^https://"
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
        config:
          type: object
          additionalProperties: true
    UpdateProjectInput:
      type: object
      additionalProperties: false
      required: [displayName, defaultBranch]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
    DeleteProjectResponse:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project:
          type: object
          additionalProperties: false
          required: [id, deleted]
          properties:
            id:
              type: string
              format: uuid
            deleted:
              type: boolean
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          $ref: "#/components/schemas/PageInfo"
    GitHubInstallationStatus:
      type: string
      enum: [active, suspended, removed]
    GitHubSyncStatus:
      type: string
      enum: [pending, syncing, ready, retry, failed]
    GitHubInstallation:
      type: object
      additionalProperties: false
      required:
        - id
        - githubInstallationId
        - accountLogin
        - accountType
        - status
        - repositorySelection
        - syncStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        githubInstallationId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: GitHub's integer installation ID encoded as a decimal string to preserve precision.
        accountLogin:
          type: string
        accountType:
          type: string
          enum: [User, Organization, Enterprise]
        status:
          $ref: "#/components/schemas/GitHubInstallationStatus"
        repositorySelection:
          type: string
          enum: [all, selected]
        syncStatus:
          $ref: "#/components/schemas/GitHubSyncStatus"
        lastSyncedAt:
          type: string
          format: date-time
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GitHubInstallationStart:
      type: object
      additionalProperties: false
      required: [installationUrl, expiresAt]
      properties:
        installationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    GitHubUserInstallation:
      type: object
      additionalProperties: false
      required:
        - githubInstallationId
        - accountLogin
        - accountType
        - repositorySelection
        - canCreateRepository
      properties:
        githubInstallationId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: GitHub's integer installation ID encoded as a decimal string to preserve precision.
        accountLogin:
          type: string
        accountType:
          type: string
          enum: [User, Organization, Enterprise]
        repositorySelection:
          type: string
          enum: [all, selected]
        canCreateRepository:
          type: boolean
        unavailableReason:
          type: string
    GitHubUserConnection:
      type: object
      additionalProperties: false
      required: [connected, installations]
      properties:
        connected:
          type: boolean
        login:
          type: string
        avatarUrl:
          type: string
          format: uri
        installations:
          type: array
          items:
            $ref: "#/components/schemas/GitHubUserInstallation"
        lastSyncedAt:
          type: string
          format: date-time
    GitHubUserAuthorizationStart:
      type: object
      additionalProperties: false
      required: [authorizeUrl, expiresAt]
      properties:
        authorizeUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    GitHubRepositoryAccessState:
      type: string
      enum: [active, revoked]
    GitHubRepository:
      type: object
      additionalProperties: false
      required:
        - githubRepositoryId
        - name
        - fullName
        - htmlUrl
        - defaultBranch
        - visibility
        - isPrivate
        - isArchived
        - access
        - grantedAt
      properties:
        githubRepositoryId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: GitHub's integer repository ID encoded as a decimal string to preserve precision.
        name:
          type: string
        fullName:
          type: string
        htmlUrl:
          type: string
          format: uri
        defaultBranch:
          type: string
        visibility:
          type: string
        isPrivate:
          type: boolean
        isArchived:
          type: boolean
        access:
          $ref: "#/components/schemas/GitHubRepositoryAccessState"
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    GitHubRepositoryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GitHubRepository"
        page:
          $ref: "#/components/schemas/PageInfo"
    CreateGitHubProjectInput:
      type: object
      additionalProperties: false
      required: [githubRepositoryId]
      properties:
        githubRepositoryId:
          type: string
          pattern: "^[1-9][0-9]*$"
        displayName:
          type: string
          maxLength: 120
        config:
          type: object
          additionalProperties: true
    CreateGitHubScratchProjectInput:
      type: object
      additionalProperties: false
      required: [displayName, githubInstallationId, orchestrator]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        githubInstallationId:
          type: string
          pattern: "^[1-9][0-9]*$"
        private:
          type: boolean
          default: true
        orchestrator:
          type: object
          additionalProperties: false
          required: [harness]
          properties:
            harness:
              type: string
              enum: [claude-code, codex, cursor]
            prompt:
              type: string
              maxLength: 65536
    CreateGitHubScratchProjectResponse:
      type: object
      additionalProperties: false
      required: [project, repository, session]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        repository:
          $ref: "#/components/schemas/GitHubRepository"
        session:
          $ref: "#/components/schemas/Session"
    SessionKind:
      type: string
      enum: [worker, orchestrator]
    SessionMode:
      type: string
      enum: [read-only, standard, trusted]
    SessionActivityState:
      type: string
      enum: [active, idle, waiting_input, blocked, exited]
      description: |
        Identical vocabulary to the local `/api/v1` agent activity state, so a
        shared view classifies a Cloud session and a local session with the same
        rule.
    SessionInterfaceMode:
      type: string
      enum: [chat, tui]
      description: |
        Which interface the session presents, matching the local `/api/v1`
        session `mode` field. Named `interfaceMode` on `Session` because Cloud's
        `mode` already means the permission mode (`SessionMode`); a client
        porting local code must read `interfaceMode`, not `mode`.
    SandboxState:
      type: string
      enum:
        - provisioning
        - starting
        - running
        - suspended
        - stopping
        - stopped
        - deleting
        - deleted
        - error
      description: |
        Compute-plane lifecycle of the session's sandbox, reported by the
        provider. Only `running` accepts messages and terminal attachment.
        `stopped` is restorable; `deleted` is not.
    SessionSandbox:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/SandboxState"
        provider:
          $ref: "#/components/schemas/ProviderName"
        providerSandboxId:
          type: string
          maxLength: 200
          description: |
            The provider's own identifier, surfaced for support and correlation.
            Clients must treat it as opaque and never route on it.
        region:
          type: string
          maxLength: 64
        lastTransitionAt:
          type: string
          format: date-time
        message:
          type: string
          maxLength: 2048
          description: |
            Operator-facing detail, present when `state` is `error` and
            otherwise only when a transition is unusually slow.
    SessionActivity:
      type: object
      additionalProperties: false
      required: [state, lastActivityAt]
      properties:
        state:
          $ref: "#/components/schemas/SessionActivityState"
        lastActivityAt:
          type: string
          format: date-time
        runtimeConnected:
          type: boolean
          description: Absent means the caller should fall back to `Session.runtimeConnected`.
        sandbox:
          $ref: "#/components/schemas/SessionSandbox"
        activeTurn:
          $ref: "#/components/schemas/Turn"
    TerminateSessionInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 2048
          description: Recorded on the session for the operator-facing history.
    RestoreSessionInput:
      type: object
      additionalProperties: false
      properties:
        sandboxProviderConnectionId:
          type: string
          format: uuid
          description: |
            Pin the restored sandbox to one organization provider connection.
            Absent reuses the connection the session last ran on, falling back
            to the organization default when that connection is gone.
        prompt:
          type: string
          maxLength: 65536
          description: |
            Message to deliver once the agent is back. Absent restores the
            session idle, which is what a client that is only reopening a
            terminated session wants.
    SessionStatus:
      type: string
      enum:
        - working
        - needs_input
        - pr_open
        - draft
        - review_pending
        - ci_failed
        - changes_requested
        - approved
        - mergeable
        - merged
        - exited
        - idle
        - terminated
        - no_signal
