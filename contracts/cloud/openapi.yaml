openapi: 3.1.0
info:
  title: AO Cloud Public API
  version: 1.0.0
  description: |
    Public AO Cloud control-plane contract plus the hosted mount of AO's shared
    application API. Hosted product requests keep their canonical /api/v1 paths
    and DTOs. X-AO-Org selects a tenant only on that authenticated application
    surface; control-plane administration keeps orgId in the path.

    A sandbox capability is provisioned out of band at /run/ao/capability with
    mode 0600. This API never returns that bearer or a general-purpose worker
    credential. Terminal tickets are single-use connection grants for the
    authenticated sandbox mux; the control plane does not relay terminal data.
servers:
  - url: https://cloud.ao.dev
security:
  - bearerAuth: []
tags:
  - name: Account
  - name: Application
  - name: Placement
  - name: GitHub
  - name: Worker

paths:
  /api/cloud/v1/auth/google:
    post:
      operationId: exchangeGoogleIdentity
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleIdentityExchange"
      responses:
        "200":
          description: AO session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AOSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/auth/refresh:
    post:
      operationId: refreshCloudSession
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Rotated AO session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AOSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/auth/logout:
    post:
      operationId: logoutCloudSession
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204": { description: Session revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/me:
    get:
      operationId: getCurrentAccount
      tags: [Account]
      responses:
        "200":
          description: Current account and memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
    get:
      operationId: listHostedProjects
      tags: [Application]
      responses:
        "200":
          description: Canonical AO project list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponse"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getHostedProject
      tags: [Application]
      responses:
        "200":
          description: Canonical AO project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGetResponse"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/v1/sessions:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
    get:
      operationId: listHostedSessions
      tags: [Application]
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: [boolean, "null"] }
        - name: orchestratorOnly
          in: query
          schema: { type: [boolean, "null"] }
        - name: fresh
          in: query
          schema: { type: [boolean, "null"] }
      responses:
        "200":
          description: Canonical AO session list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "500": { $ref: "#/components/responses/SharedInternalError" }
    post:
      operationId: spawnHostedSession
      tags: [Application]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpawnSessionRequest"
      responses:
        "201":
          description: Canonical AO session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpawnSessionResponse"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "409": { $ref: "#/components/responses/SharedConflict" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/v1/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getHostedSession
      tags: [Application]
      responses:
        "200":
          description: Canonical AO session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/v1/sessions/{sessionId}/send:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: sendHostedSessionMessage
      tags: [Application]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSessionMessageRequest"
      responses:
        "200":
          description: Canonical AO send result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendSessionMessageResponse"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "409": { $ref: "#/components/responses/SharedConflict" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/v1/sessions/{sessionId}/pr:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listHostedSessionPullRequests
      tags: [Application]
      responses:
        "200":
          description: Canonical AO pull-request facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionPRsResponse"
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "500": { $ref: "#/components/responses/SharedInternalError" }
        "501": { $ref: "#/components/responses/SharedNotImplemented" }

  /api/v1/sessions/{sessionId}/reviews:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listHostedSessionReviews
      tags: [Application]
      responses:
        "200":
          description: Canonical AO review state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReviewsResponse"
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "422": { $ref: "#/components/responses/SharedUnprocessable" }
        "501": { $ref: "#/components/responses/SharedNotImplemented" }

  /api/v1/sessions/{sessionId}/workspace/files:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listHostedWorkspaceFiles
      tags: [Application]
      responses:
        "200":
          description: Canonical AO workspace file list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWorkspaceFilesResponse"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "500": { $ref: "#/components/responses/SharedInternalError" }
        "501": { $ref: "#/components/responses/SharedNotImplemented" }

  /api/v1/sessions/{sessionId}/workspace/file:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
      - $ref: "#/components/parameters/SessionId"
      - name: path
        in: query
        required: true
        schema: { type: string }
    get:
      operationId: readHostedWorkspaceFile
      tags: [Application]
      responses:
        "200":
          description: Canonical AO workspace file and diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFileResponse"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "500": { $ref: "#/components/responses/SharedInternalError" }
        "501": { $ref: "#/components/responses/SharedNotImplemented" }

  /api/v1/sessions/{sessionId}/terminal-ticket:
    parameters:
      - $ref: "#/components/parameters/XAOOrg"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createSandboxTerminalConnection
      tags: [Application]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Atomically issues one connection ticket for the session sandbox mux.
        Replaying a consumed ticket fails; terminal bytes never traverse a
        control-plane terminal endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalConnectionRequest"
      responses:
        "201":
          description: One-time sandbox mux connection metadata.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalConnection"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/SharedUnauthorized" }
        "403": { $ref: "#/components/responses/SharedForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "409": { $ref: "#/components/responses/SharedConflict" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/cloud/v1/orgs/{orgId}/workspaces:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createWorkspacePlacement
      tags: [Placement]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Accepts the asynchronous project-placement saga. A successful response
        is not a project. Poll the returned operation until ready, then discover
        the canonical project through GET /api/v1/projects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspacePlacementInput"
      responses:
        "202":
          description: Placement operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlacementOperation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/workspaces/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getWorkspacePlacement
      tags: [Placement]
      responses:
        "200":
          description: Current placement operation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlacementOperation"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubInstallations
      tags: [GitHub]
      responses:
        "200":
          description: Organization GitHub App installations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations/start:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: startGitHubInstallation
      tags: [GitHub]
      responses:
        "201":
          description: Single-use installation flow started.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationStart"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    delete:
      operationId: disconnectGitHubInstallation
      tags: [GitHub]
      responses:
        "204": { description: Installation disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/repositories:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    get:
      operationId: listGitHubInstallationRepositories
      tags: [GitHub]
      responses:
        "200":
          description: Repositories visible through the installation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: setGitHubRepositoryAllowlist
      tags: [GitHub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubRepositoryAllowlistInput"
      responses:
        "200":
          description: Updated repository allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/sync:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: syncGitHubInstallation
      tags: [GitHub]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Synchronized repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/github/installations/callback:
    get:
      operationId: completeGitHubInstallation
      tags: [GitHub]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: installation_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: setup_action
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Installation linked when no completion redirect is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallation"
        "302": { description: Browser redirected to the configured completion URL. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/github/webhook:
    post:
      operationId: receiveGitHubWebhook
      tags: [GitHub]
      security: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: { type: string }
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Authenticated delivery accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubWebhookAcceptance"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/cloud/v1/worker/bootstrap:
    post:
      operationId: acknowledgeWorkerBootstrap
      tags: [Worker]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Atomically consumes one scoped bootstrap delivery. The bearer used for
        this request was delivered out of band in /run/ao/capability and is not
        repeated in either request or response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerBootstrapInput"
      responses:
        "200":
          description: Bootstrap delivery consumed or replayed idempotently.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerBootstrapGrant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
      security:
        - workerAuth: []

  /api/cloud/v1/worker/status:
    get:
      operationId: getWorkerStatus
      tags: [Worker]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Capability-scoped worker and placement status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerStatus"
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/heartbeat:
    post:
      operationId: heartbeatWorker
      tags: [Worker]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatInput"
      responses:
        "200":
          description: Liveness recorded without returning a replacement bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerStatus"
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: sendWorkerSessionMessage
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSessionMessageRequest"
      responses:
        "200":
          description: Canonical AO send result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendSessionMessageResponse"
        "400": { $ref: "#/components/responses/SharedBadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "409": { $ref: "#/components/responses/SharedConflict" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}/pull-requests:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listWorkerSessionPullRequests
      tags: [Worker]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Canonical AO pull-request facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionPRsResponse"
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/SharedNotFound" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}/reviews:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listWorkerSessionReviews
      tags: [Worker]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Canonical AO review state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReviewsResponse"
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "422": { $ref: "#/components/responses/SharedUnprocessable" }
        "500": { $ref: "#/components/responses/SharedInternalError" }

  /api/cloud/v1/worker/checkout-grant:
    post:
      operationId: requestWorkerCheckoutGrant
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Requests one scoped checkout delivery. The control plane returns only
        delivery state; repository credentials are installed by the sandbox
        delivery mechanism and never appear in JSON, argv, environment, or git
        configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCheckoutGrantInput"
      responses:
        "202":
          description: Checkout delivery accepted.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCheckoutGrant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AO access token
    workerAuth:
      type: http
      scheme: bearer
      bearerFormat: capability from /run/ao/capability

  parameters:
    XAOOrg:
      name: X-AO-Org
      in: header
      required: false
      description: |
        Hosted /api/v1 tenant selector. Required when the principal belongs to
        multiple organizations. It is never an authority for control-plane
        admin routes, whose orgId path parameter remains authoritative.
      schema: { type: string, minLength: 1 }
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }

  responses:
    BadRequest: { $ref: "#/components/responses/ErrorResponse" }
    Unauthorized: { $ref: "#/components/responses/ErrorResponse" }
    Forbidden: { $ref: "#/components/responses/ErrorResponse" }
    NotFound: { $ref: "#/components/responses/ErrorResponse" }
    Conflict: { $ref: "#/components/responses/ErrorResponse" }
    RateLimited: { $ref: "#/components/responses/ErrorResponse" }
    InternalError: { $ref: "#/components/responses/ErrorResponse" }
    WorkerUnauthorized: { $ref: "#/components/responses/ErrorResponse" }
    WorkerForbidden: { $ref: "#/components/responses/ErrorResponse" }
    ErrorResponse:
      description: Canonical control-plane error with request correlation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SharedBadRequest: { $ref: "#/components/responses/SharedErrorResponse" }
    SharedUnauthorized: { $ref: "#/components/responses/SharedErrorResponse" }
    SharedForbidden: { $ref: "#/components/responses/SharedErrorResponse" }
    SharedNotFound: { $ref: "#/components/responses/SharedErrorResponse" }
    SharedConflict: { $ref: "#/components/responses/SharedErrorResponse" }
    SharedUnprocessable: { $ref: "#/components/responses/SharedErrorResponse" }
    SharedNotImplemented: { $ref: "#/components/responses/SharedErrorResponse" }
    SharedInternalError: { $ref: "#/components/responses/SharedErrorResponse" }
    SharedErrorResponse:
      description: Canonical shared /api/v1 error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

  schemas:
    # Shared application DTOs are references to the code-generated daemon API.
    # The parity test locks these names and targets so Cloud cannot fork App*
    # product models or silently drift from /api/v1.
    APIError:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/APIError"
    ListProjectsResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/ListProjectsResponse"
    ProjectGetResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/ProjectGetResponse"
    ProjectSummary:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/ProjectSummary"
    ListSessionsResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/ListSessionsResponse"
    SessionResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/SessionResponse"
    ControllersSessionView:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/ControllersSessionView"
    SpawnSessionRequest:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/SpawnSessionRequest"
    SpawnSessionResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/SpawnSessionResponse"
    SendSessionMessageRequest:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/SendSessionMessageRequest"
    SendSessionMessageResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/SendSessionMessageResponse"
    ListSessionPRsResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/ListSessionPRsResponse"
    ListReviewsResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/ListReviewsResponse"
    ListWorkspaceFilesResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/ListWorkspaceFilesResponse"
    WorkspaceFileResponse:
      $ref: "../../backend/internal/httpd/apispec/openapi.yaml#/components/schemas/WorkspaceFileResponse"

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, code, message, requestId]
      properties:
        error: { type: string }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    GoogleIdentityExchange:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 1 }
    RefreshTokenInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    AOSession:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [orgId, orgSlug, displayName, role]
      properties:
        orgId: { type: string, format: uuid }
        orgSlug: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, member] }
    CurrentAccount:
      type: object
      additionalProperties: false
      required: [user, organizations]
      properties:
        user: { $ref: "#/components/schemas/CurrentUser" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrganizationMembership" }

    CreateWorkspacePlacementInput:
      type: object
      additionalProperties: false
      required: [displayName, repositoryUrl, defaultBranch]
      properties:
        displayName: { type: string, minLength: 1 }
        repositoryUrl: { type: string, format: uri }
        defaultBranch:
          type: string
          minLength: 1
          description: Authoritative branch passed through the placement saga.
        config:
          type: object
          additionalProperties: true
    WorkspacePlacementState:
      type: string
      enum: [pending, failed, ready]
    WorkspacePlacementOperation:
      type: object
      additionalProperties: false
      required: [operationId, orgId, state, defaultBranch, createdAt, updatedAt]
      properties:
        operationId: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/WorkspacePlacementState" }
        defaultBranch: { type: string }
        projectId:
          type: string
          description: Present only when state is ready; discover its DTO through /api/v1/projects.
        failure:
          $ref: "#/components/schemas/PlacementFailure"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlacementFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    GitHubInstallation:
      type: object
      additionalProperties: false
      required: [id, orgId, provider, accountLogin, accountType, appSlug, repositorySelection, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        provider: { type: string, const: github }
        accountLogin: { type: string }
        accountType: { type: string }
        appSlug: { type: string }
        repositorySelection: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GitHubInstallationList:
      type: object
      additionalProperties: false
      required: [installations]
      properties:
        installations:
          type: array
          items: { $ref: "#/components/schemas/GitHubInstallation" }
    GitHubInstallationStart:
      type: object
      additionalProperties: false
      required: [installUrl, expiresAt]
      properties:
        installUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    GitHubRepository:
      type: object
      additionalProperties: false
      required: [id, fullName, private, allowed]
      properties:
        id: { type: string }
        fullName: { type: string }
        private: { type: boolean }
        allowed: { type: boolean }
    GitHubRepositoryList:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          items: { $ref: "#/components/schemas/GitHubRepository" }
    GitHubRepositoryAllowlistInput:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          uniqueItems: true
          items: { type: string }
    GitHubWebhookAcceptance:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [accepted, duplicate] }

    TerminalConnectionRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [agent, workspace] }
        after: { type: integer, format: int64, minimum: 0 }
    TerminalConnection:
      type: object
      additionalProperties: false
      required: [connectionUrl, ticket, expiresAt, protocol]
      properties:
        connectionUrl:
          type: string
          format: uri
          description: Authenticated sandbox mux WebSocket URL, never a control-plane relay URL.
        ticket:
          type: string
          description: Single-use ticket consumed atomically by the sandbox mux.
        expiresAt: { type: string, format: date-time }
        protocol: { type: string, const: ao.mux.v1 }

    WorkerBootstrapInput:
      type: object
      additionalProperties: false
      required: [deliveryId, version, capabilities]
      properties:
        deliveryId: { type: string, format: uuid }
        version: { type: string }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
    WorkerBootstrapGrant:
      type: object
      additionalProperties: false
      required: [deliveryId, state, scope, consumedAt]
      properties:
        deliveryId: { type: string, format: uuid }
        state: { type: string, enum: [consumed] }
        scope: { $ref: "#/components/schemas/WorkerScope" }
        consumedAt: { type: string, format: date-time }
    WorkerScope:
      type: object
      additionalProperties: false
      required: [orgId, workspaceId, sessionId, role]
      properties:
        orgId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        sessionId: { type: string }
        role: { type: string, enum: [coordinator, worker] }
    WorkerHeartbeatInput:
      type: object
      additionalProperties: false
      required: [version, capabilities]
      properties:
        version: { type: string }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
    WorkerStatus:
      type: object
      additionalProperties: false
      required: [scope, placementState, observedAt]
      properties:
        scope: { $ref: "#/components/schemas/WorkerScope" }
        placementState: { type: string, enum: [pending, running, stopping, stopped, failed] }
        observedAt: { type: string, format: date-time }
    WorkerCheckoutGrantInput:
      type: object
      additionalProperties: false
      required: [deliveryId, repositoryId, operation]
      properties:
        deliveryId: { type: string, format: uuid }
        repositoryId: { type: string }
        operation: { type: string, enum: [clone, fetch] }
    WorkerCheckoutGrant:
      type: object
      additionalProperties: false
      required: [deliveryId, repositoryId, operation, state, expiresAt]
      properties:
        deliveryId: { type: string, format: uuid }
        repositoryId: { type: string }
        operation: { type: string, enum: [clone, fetch] }
        state: { type: string, enum: [pending, delivered, failed, expired] }
        expiresAt: { type: string, format: date-time }
        failure:
          $ref: "#/components/schemas/PlacementFailure"
