openapi: 3.1.0
info:
  title: AO Cloud Public API
  version: 1.0.0
  description: |
    Public AO Cloud control-plane contract. The separate code-first application
    specification and client own all product projects, sessions, conversations,
    worktrees, and shared application DTOs. Control-plane administration keeps
    orgId in the path and validates the authenticated principal's membership.

    A sandbox capability is provisioned out of band at /run/ao/capability with
    mode 0600. This API never returns that bearer or a general-purpose worker
    credential. Terminal tickets are single-use connection grants for the
    authenticated sandbox mux; the control plane does not relay terminal data.
servers:
  - url: https://cloud.ao.dev
security:
  - bearerAuth: []
tags:
  - name: Account
  - name: Placement
  - name: GitHub
  - name: Vault
  - name: Terminal
  - name: Worker
  - name: Worker Lifecycle
  - name: Worker Execution
  - name: Worker Transport

paths:
  /api/cloud/v1/auth/google:
    post:
      operationId: exchangeGoogleIdentity
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleIdentityExchange"
      responses:
        "200":
          description: AO session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AOSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/auth/refresh:
    post:
      operationId: refreshCloudSession
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Rotated AO session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AOSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/auth/logout:
    post:
      operationId: logoutCloudSession
      tags: [Account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204": { description: Session revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/me:
    get:
      operationId: getCurrentAccount
      tags: [Account]
      responses:
        "200":
          description: Current account and memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/workspaces:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listWorkspacePlacements
      tags: [Placement]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tenant-scoped workspace placement page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspacePlacementPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createWorkspacePlacement
      tags: [Placement]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Accepts the asynchronous project-placement saga. A successful response
        is placement acceptance, not a product project response. Poll the
        returned workspace until ready; project discovery remains exclusively
        on the separate code-first application API and client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspacePlacementInput"
      responses:
        "202":
          description: Placement operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlacement"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspacePlacement
      tags: [Placement]
      responses:
        "200":
          description: Current placement operation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePlacement"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteWorkspacePlacement
      tags: [Placement]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Workspace deletion accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspacePlacement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/workspaces/{workspaceId}/resume:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: resumeWorkspacePlacement
      tags: [Placement]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Workspace resume accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspacePlacement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/provider-connections:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listProviderConnections
      tags: [Vault]
      responses:
        "200":
          description: Redacted organization provider connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConnectionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/provider-connections/agents/{provider}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/Provider"
    put:
      operationId: putAgentProviderConnection
      tags: [Vault]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutAgentProviderConnectionInput" }
      responses:
        "200":
          description: Redacted provider connection metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderConnectionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteAgentProviderConnection
      tags: [Vault]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Provider connection deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/terminal-ticket:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createTerminalTicket
      tags: [Terminal]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalTicketRequest" }
      responses:
        "201":
          description: One-time ticket and direct sandbox mux metadata.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/sandbox/terminal-tickets/consume:
    post:
      operationId: consumeTerminalTicket
      tags: [Terminal]
      security:
        - workerAuth: []
      description: Atomically consumes a one-time ticket for the bound sandbox tuple.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalTicketRedemption" }
      responses:
        "200":
          description: Scope grant for the exact sandbox, workspace, and session.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalTicketGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubInstallations
      tags: [GitHub]
      responses:
        "200":
          description: Organization GitHub App installations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations/start:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: startGitHubInstallation
      tags: [GitHub]
      responses:
        "201":
          description: Single-use installation flow started.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationStart"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    delete:
      operationId: disconnectGitHubInstallation
      tags: [GitHub]
      responses:
        "204": { description: Installation disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/repositories:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    get:
      operationId: listGitHubInstallationRepositories
      tags: [GitHub]
      responses:
        "200":
          description: Repositories visible through the installation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: setGitHubRepositoryAllowlist
      tags: [GitHub]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubRepositoryAllowlistInput"
      responses:
        "200":
          description: Updated repository allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/sync:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: syncGitHubInstallation
      tags: [GitHub]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Synchronized repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/github/installations/callback:
    get:
      operationId: completeGitHubInstallation
      tags: [GitHub]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: installation_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: setup_action
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Installation linked when no completion redirect is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallation"
        "302": { description: Browser redirected to the configured completion URL. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/github/webhook:
    post:
      operationId: receiveGitHubWebhook
      tags: [GitHub]
      security: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: { type: string }
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Authenticated delivery accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubWebhookAcceptance"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/cloud/v1/worker/bootstrap:
    post:
      operationId: acknowledgeWorkerBootstrap
      tags: [Worker]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Atomically consumes one scoped bootstrap delivery. The bearer used for
        this request was delivered out of band in /run/ao/capability and is not
        repeated in either request or response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerBootstrapInput"
      responses:
        "200":
          description: Bootstrap delivery consumed or replayed idempotently.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerBootstrapGrant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
      security:
        - workerAuth: []

  /api/cloud/v1/worker/status:
    get:
      operationId: getWorkerStatus
      tags: [Worker]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Capability-scoped worker and placement status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerStatus"
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/heartbeat:
    post:
      operationId: heartbeatWorker
      tags: [Worker]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatInput"
      responses:
        "200":
          description: Liveness recorded without returning a replacement bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerStatus"
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/sessions:
    get:
      operationId: listWorkerSessions
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Capability-scoped session page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerSessionPage" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createWorkerSession
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkerSessionInput" }
      responses:
        "202":
          description: Worker session creation accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getWorkerSession
      tags: [Worker]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Capability-scoped worker session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerSession" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteWorkerSession
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Worker session deletion accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerSession" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listWorkerSessionMessages
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Capability-scoped message page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerMessagePage" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: sendWorkerSessionMessage
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerMessageInput"
      responses:
        "200":
          description: Message accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerMessage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}/pr/claim:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: claimWorkerSessionPullRequest
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerPullRequestClaimInput" }
      responses:
        "200":
          description: Pull request claim result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPullRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}/pr:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listWorkerSessionPullRequests
      tags: [Worker]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Pull-request facts visible to the capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerPullRequestPage"
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}/reviews:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listWorkerSessionReviews
      tags: [Worker]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Review state visible to the capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerReviewPage"
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/sessions/{sessionId}/reviews/submit:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: submitWorkerSessionReview
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerReviewSubmitInput" }
      responses:
        "200":
          description: Review submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cloud/v1/worker/events:
    post:
      operationId: publishWorkerEvent
      tags: [Worker Execution]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerEventInput" }
      responses:
        "202":
          description: Event durably accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerOKResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/cloud/v1/worker/turns/claim:
    post:
      operationId: claimWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Claimed turn or null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerClaimTurnResponse" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }

  /api/cloud/v1/worker/turns/{turnId}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    get:
      operationId: getWorkerTurnCancellation
      tags: [Worker Execution]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/Attempt"
      responses:
        "200":
          description: Cancellation state for the fenced attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerCancellationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/cloud/v1/worker/turns/{turnId}/complete:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: completeWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerCompleteTurnInput" }
      responses:
        "200":
          description: Fenced completion accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerFinishTurnResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/cloud/v1/worker/turns/{turnId}/fail:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: failWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerFailTurnInput" }
      responses:
        "200":
          description: Fenced failure accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerFinishTurnResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/cloud/v1/worker/transport/claim:
    post:
      operationId: claimWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      responses:
        "200":
          description: Claimed non-terminal transport request or null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerClaimTransportResponse" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }

  /api/cloud/v1/worker/transport/{requestId}/complete:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: completeWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerCompleteTransportInput" }
      responses:
        "200":
          description: Transport result recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerOKResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/cloud/v1/worker/transport/{requestId}/fail:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: failWorkerTransport
      tags: [Worker Transport]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerFailTransportInput" }
      responses:
        "200":
          description: Transport failure recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerOKResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/cloud/v1/worker/checkout-grant:
    post:
      operationId: requestWorkerCheckoutGrant
      tags: [Worker]
      security:
        - workerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: |
        Requests one scoped checkout delivery. The control plane returns only
        delivery state; repository credentials are installed by the sandbox
        delivery mechanism and never appear in JSON, argv, environment, or git
        configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCheckoutGrantInput"
      responses:
        "202":
          description: Checkout delivery accepted.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCheckoutGrant"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WorkerUnauthorized" }
        "403": { $ref: "#/components/responses/WorkerForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AO access token
    workerAuth:
      type: http
      scheme: bearer
      bearerFormat: capability from /run/ao/capability

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [claude-code, codex, cursor] }
    TurnId:
      name: turnId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Attempt:
      name: attempt
      in: query
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest: { $ref: "#/components/responses/ErrorResponse" }
    Unauthorized: { $ref: "#/components/responses/ErrorResponse" }
    Forbidden: { $ref: "#/components/responses/ErrorResponse" }
    NotFound: { $ref: "#/components/responses/ErrorResponse" }
    Conflict: { $ref: "#/components/responses/ErrorResponse" }
    RateLimited: { $ref: "#/components/responses/ErrorResponse" }
    InternalError: { $ref: "#/components/responses/ErrorResponse" }
    WorkerUnauthorized: { $ref: "#/components/responses/ErrorResponse" }
    WorkerForbidden: { $ref: "#/components/responses/ErrorResponse" }
    ErrorResponse:
      description: Canonical control-plane error with request correlation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, code, message, requestId]
      properties:
        error: { type: string }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    GoogleIdentityExchange:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 1 }
    RefreshTokenInput:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    AOSession:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [orgId, orgSlug, displayName, role]
      properties:
        orgId: { type: string, format: uuid }
        orgSlug: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, member] }
    CurrentAccount:
      type: object
      additionalProperties: false
      required: [user, organizations]
      properties:
        user: { $ref: "#/components/schemas/CurrentUser" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrganizationMembership" }

    CreateWorkspacePlacementInput:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1 }
        repositoryUrl: { type: string, format: uri }
        defaultBranch:
          type: string
          minLength: 1
          description: Authoritative branch passed through the placement saga.
        config:
          type: object
          additionalProperties: true
    WorkspacePlacementState:
      type: string
      enum: [pending, failed, ready]
    WorkspacePlacement:
      type: object
      additionalProperties: false
      required: [id, orgId, ownerUserId, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/WorkspacePlacementState" }
        projectId:
          type: string
          description: Present only when state is ready; discovery uses the separate application client.
        message:
          type: string
          description: Human-readable pending progress or terminal failure detail.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspacePlacementPage:
      type: object
      additionalProperties: false
      required: [workspaces, pageInfo]
      properties:
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/WorkspacePlacement" }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        hasMore: { type: boolean }
        nextCursor: { type: string }
    PlacementFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    GitHubInstallation:
      type: object
      additionalProperties: false
      required: [id, orgId, provider, accountLogin, accountType, appSlug, repositorySelection, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        provider: { type: string, const: github }
        accountLogin: { type: string }
        accountType: { type: string }
        appSlug: { type: string }
        repositorySelection: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GitHubInstallationList:
      type: object
      additionalProperties: false
      required: [installations]
      properties:
        installations:
          type: array
          items: { $ref: "#/components/schemas/GitHubInstallation" }
    GitHubInstallationStart:
      type: object
      additionalProperties: false
      required: [installUrl, expiresAt]
      properties:
        installUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    GitHubRepository:
      type: object
      additionalProperties: false
      required: [id, fullName, private, allowed]
      properties:
        id: { type: string }
        fullName: { type: string }
        private: { type: boolean }
        allowed: { type: boolean }
    GitHubRepositoryList:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          items: { $ref: "#/components/schemas/GitHubRepository" }
    GitHubRepositoryAllowlistInput:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          uniqueItems: true
          items: { type: string }
    GitHubWebhookAcceptance:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [accepted, duplicate] }

    ProviderConnectionList:
      type: object
      additionalProperties: false
      required: [providerConnections]
      properties:
        providerConnections:
          type: array
          items: { $ref: "#/components/schemas/RedactedProviderConnection" }
    ProviderConnectionResponse:
      type: object
      additionalProperties: false
      required: [providerConnection]
      properties:
        providerConnection: { $ref: "#/components/schemas/RedactedProviderConnection" }
    RedactedProviderConnection:
      type: object
      additionalProperties: false
      required: [provider, configured, updatedAt]
      properties:
        provider: { type: string, enum: [claude-code, codex, cursor] }
        configured: { type: boolean }
        label: { type: string }
        updatedAt: { type: string, format: date-time }
    PutAgentProviderConnectionInput:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          writeOnly: true
          format: password
          minLength: 1
        label: { type: string }

    TerminalTicketRequest:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/TerminalTicketScope" }
    TerminalTicketScope:
      type: string
      enum: [terminal:read, terminal:operate, workspace:observe]
    TerminalTicket:
      type: object
      additionalProperties: false
      required: [connectionUrl, ticket, scopes, expiresAt, protocol]
      properties:
        connectionUrl:
          type: string
          format: uri
          description: Authenticated sandbox mux WebSocket URL, never a control-plane relay URL.
        ticket:
          type: string
          pattern: '^ao\.ticket\.[A-Za-z0-9_-]+$'
          description: Single-use ticket offered only as the WebSocket subprotocol.
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/TerminalTicketScope" }
        expiresAt: { type: string, format: date-time }
        protocol: { type: string, const: ao.mux.v1 }
    TerminalTicketRedemption:
      type: object
      additionalProperties: false
      required: [ticket, sandboxId, workspaceId, sessionId]
      properties:
        ticket: { type: string, pattern: '^ao\.ticket\.[A-Za-z0-9_-]+$' }
        sandboxId: { type: string }
        workspaceId: { type: string }
        sessionId: { type: string }
    TerminalTicketGrant:
      type: object
      additionalProperties: false
      required: [sandboxId, workspaceId, sessionId, scopes, expiresAt]
      properties:
        sandboxId: { type: string }
        workspaceId: { type: string }
        sessionId: { type: string }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/TerminalTicketScope" }
        expiresAt: { type: string, format: date-time }

    WorkerBootstrapInput:
      type: object
      additionalProperties: false
      required: [deliveryId, version, capabilities]
      properties:
        deliveryId: { type: string, format: uuid }
        version: { type: string }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
    WorkerBootstrapGrant:
      type: object
      additionalProperties: false
      required: [deliveryId, state, scope, consumedAt]
      properties:
        deliveryId: { type: string, format: uuid }
        state: { type: string, enum: [consumed] }
        scope: { $ref: "#/components/schemas/WorkerScope" }
        consumedAt: { type: string, format: date-time }
    WorkerScope:
      type: object
      additionalProperties: false
      required: [orgId, workspaceId, sessionId, role]
      properties:
        orgId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        sessionId: { type: string }
        role: { type: string, enum: [coordinator, worker] }
    WorkerHeartbeatInput:
      type: object
      additionalProperties: false
      required: [version, capabilities]
      properties:
        version: { type: string }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
    WorkerStatus:
      type: object
      additionalProperties: false
      required: [scope, placementState, observedAt]
      properties:
        scope: { $ref: "#/components/schemas/WorkerScope" }
        placementState: { type: string, enum: [pending, running, stopping, stopped, failed] }
        observedAt: { type: string, format: date-time }
    CreateWorkerSessionInput:
      type: object
      additionalProperties: false
      required: [projectId, role, harness]
      properties:
        projectId: { type: string }
        role: { type: string, enum: [coordinator, worker] }
        harness: { type: string }
        prompt: { type: string, maxLength: 65536 }
    WorkerSession:
      type: object
      additionalProperties: false
      required: [id, workspaceId, projectId, role, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string }
        role: { type: string, enum: [coordinator, worker] }
        state: { type: string, enum: [pending, running, stopping, stopped, failed] }
        failure: { $ref: "#/components/schemas/PlacementFailure" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkerSessionPage:
      type: object
      additionalProperties: false
      required: [sessions, pageInfo]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/WorkerSession" }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    WorkerMessageInput:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 65536 }
    WorkerMessage:
      type: object
      additionalProperties: false
      required: [id, sessionId, role, message, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    WorkerMessagePage:
      type: object
      additionalProperties: false
      required: [messages, pageInfo]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/WorkerMessage" }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    WorkerPullRequestClaimInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri }
    WorkerPullRequest:
      type: object
      additionalProperties: false
      required: [url, number, state, title]
      properties:
        url: { type: string, format: uri }
        number: { type: integer, minimum: 1 }
        state: { type: string, enum: [draft, open, merged, closed] }
        title: { type: string }
        headSha: { type: string }
    WorkerPullRequestPage:
      type: object
      additionalProperties: false
      required: [pullRequests]
      properties:
        pullRequests:
          type: array
          items: { $ref: "#/components/schemas/WorkerPullRequest" }
    WorkerReview:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, passed, failed, cancelled] }
        verdict: { type: string, enum: [approve, comment, request_changes] }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkerReviewPage:
      type: object
      additionalProperties: false
      required: [reviews]
      properties:
        reviews:
          type: array
          items: { $ref: "#/components/schemas/WorkerReview" }
    WorkerReviewSubmitInput:
      type: object
      additionalProperties: false
      required: [verdict, summary]
      properties:
        verdict: { type: string, enum: [approve, comment, request_changes] }
        summary: { type: string, minLength: 1, maxLength: 65536 }
    WorkerEventInput:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type: { type: string, enum: [worker.ready, chat.assistant_delta, agent.activity] }
