          type: string
          format: uuid
        displayName:
          type: string
        repositoryUrl:
          type: string
          format: uri
        defaultBranch:
          type: string
        githubRepositoryId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: GitHub's integer repository ID encoded as a decimal string to preserve precision.
        config:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

            The default is stated here rather than as a schema `default:`
            because `openapi-typescript` promotes a defaulted response property
            to a required one, which would break the clients this field exists
            to keep working.
        lifecycleState:
