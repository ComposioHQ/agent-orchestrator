name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A few sentences in your own words are enough. Search existing issues when possible,
        and submit from your own GitHub account so we can follow up with you.
        Please don't ask AO Bot to file on your behalf.
        For help, join [Discord](https://discord.com/invite/UZv7JjxbwG).

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: |
        Describe what you did and what went wrong. If you can, include what you expected,
        steps to reproduce, how often it happens, and your AO version and OS.
        Missing details or a bug you can't reproduce reliably are OK.
      placeholder: When I ..., I saw ... . I expected ... .
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or supporting evidence (optional)
      description: |
        Drag in screenshots, a recording, or relevant diagnostic files. Remove secrets and
        unrelated personal data first. We recommend the bug-triage skill for local agent help:
        https://github.com/Untrivial-ai/agent-orchestrator/blob/main/.agents/skills/bug-triage/SKILL.md
        Keep agent-collected logs, database excerpts, and analysis in clearly labeled attachments,
        separate from your description. You can add evidence later.
    validations:
      required: false
