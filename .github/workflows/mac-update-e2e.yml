name: macOS update e2e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: v0.12.0
            channel: latest
          - baseline: v0.12.0
            channel: nightly
          - baseline: v0.12.10
            channel: nightly
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run signed release update on disposable runner only
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ matrix.baseline }}
          CHANNEL: ${{ matrix.channel }}
        run: python3 frontend/scripts/reproduce-4254.py "$BASELINE" "$CHANNEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.baseline }}-${{ matrix.channel }}
          path: |
            ~/.ao/issue4254/evidence/*.log
            ~/.ao/issue4254/evidence/*.json
            ~/.ao/issue4254/evidence/*.jsonl
            ~/.ao/issue4254/evidence/*.yml
            ~/.ao/issue4254/evidence/*.plist
          retention-days: 3
      - name: Package evidence without losing macOS metadata
        if: always()
        run: |
          if [ -d "$HOME/.ao/issue4254/evidence" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$HOME/.ao/issue4254/evidence" "$HOME/.ao/issue4254/evidence.zip"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue4254-${{ matrix.baseline }}-${{ matrix.channel }}
          path: ~/.ao/issue4254/evidence.zip
          retention-days: 3
