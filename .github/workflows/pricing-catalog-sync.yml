name: Refresh pricing catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Forks must never receive an authenticated bot token or create branches.
    if: github.repository == 'Untrivial-ai/agent-orchestrator'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint pricing catalog GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.PRICING_CATALOG_APP_ID }}
          private-key: ${{ secrets.PRICING_CATALOG_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Resolve and download pinned LiteLLM catalog source
        id: source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          revision="$(gh api repos/BerriAI/litellm/commits/main --jq .sha)"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "LiteLLM main did not resolve to a full SHA" >&2
            exit 1
          fi
          curl --fail --location --max-filesize 33554432 \
            --output "$RUNNER_TEMP/model_prices_and_context_window.json" \
            "https://raw.githubusercontent.com/BerriAI/litellm/$revision/model_prices_and_context_window.json"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Generate and validate catalog
        id: generate
        env:
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          go run ./backend/cmd/pricingcatalog sync -root . \
            -source "$RUNNER_TEMP/model_prices_and_context_window.json" \
            -revision "$REVISION"
          go run ./backend/cmd/pricingcatalog validate -root .
          if git diff --quiet -- pricing/catalog/v1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update catalog pull request
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "pricing-catalog[bot]"
          git config user.email "pricing-catalog[bot]@users.noreply.github.com"
          git switch -C automation/pricing-catalog
          git add pricing/catalog/v1
          git commit -m "chore(pricing): refresh LiteLLM catalog"
          ./scripts/pricing-catalog-update-branch.sh origin automation/pricing-catalog
          pr="$(gh pr list --head automation/pricing-catalog --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head automation/pricing-catalog \
              --title "chore(pricing): refresh LiteLLM catalog" \
              --body "Automated refresh from pinned LiteLLM revision ${{ steps.source.outputs.revision }}."
          else
            gh pr edit "$pr" --title "chore(pricing): refresh LiteLLM catalog" \
              --body "Automated refresh from pinned LiteLLM revision ${{ steps.source.outputs.revision }}."
          fi
